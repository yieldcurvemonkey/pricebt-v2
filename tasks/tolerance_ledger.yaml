# Tolerance ledger (spec X3 and section 11.3). Every tie-out tolerance in this project, the value MEASURED on real fixtures, and the reason.
#
# Policy: the shipped defaults (`pricebt.tieout.tolerances.DEFAULT_TOLERANCES`) are the placeholders of spec Appendix B plus four structural decisions listed under `defaults_added`.
# A tolerance is NEVER widened to turn a run green without an entry here; a run's tolerances are declared in the base config (`tieout.tolerances`) next to the strategy they belong to,
# and each declared key has an entry below with the measured value it is based on. Values are relative unless a unit is given: |a - b| / max(|reference|, floor), so a quantity
# below `floor` (currency, or per unit of a 1mm swap) is compared absolutely with the tolerance `rel * floor`.
# The stacks: `reference` (dependency-free, closed form), `rateslib`, `quantlib`; all three consume the SAME snapshots (digests equal) and the SAME conventions block.

defaults_added:
  - {key: "L1.quantity", value: "rel 0, floor 1e-12, strict", reason: "a position size is an invariant when trades are sized from inputs the stacks share; `strict` means a level wildcard (`L1.*`) does not widen it, only a declaration that names it does. A strategy that sizes trades from a MEASURED risk declares it (see swap_book)"}
  - {key: "L2.delta_ladder", value: "rel 1e-3, floor 100 (per bucket, currency per bp per unit)", reason: "per-bucket ladder noise does not shrink with the bucket: the libraries agree to 2.3e-4 of the largest bucket at worst (measured below)"}
  - {key: "L4.stats_ratios", value: "rel 5e-2, floor 1e-6", reason: "skew, kurtosis, Sortino, Calmar, profit factor, VaR, CVaR are ratios of small numbers: measured 2.8e-6 on the swap book, but a 1e-6 difference in a denominator moves them by 1e-2 in general"}
  - {key: "L4.stats_traded", value: "rel 1e-5, floor 1.0 (currency)", reason: "turnover = sum |quantity x entry pv|: for par swaps the entry pv is numerical zero (1e-10 per unit), so turnover is ~1e-7 currency of noise on the swap book (measured 6.9e-8 vs 8.0e-8 vs 2.2e-7): compared absolutely below one currency unit"}

runs:
  swap_book:
    what: "the showcase strategy: monthly ladder hedge of a USD SOFR OIS book to a 1,000,000 per bp dollar delta in the 10Y bucket (hedge set 2Y/5Y/10Y/30Y, receive fixed), real EOD SOFR curves, 2024-01-02 .. 2024-06-28, 124 audited marks per stack pair"
    command: "python -m pricebt tieout notebooks/... (see notebooks/src/showcase_swap_book.py, section 8; the window ends 2024-06-28)"
    self_test: "the reference stack run twice: exactly zero difference at every level (X5a) - passed"
    measured:   # reference vs rateslib | reference vs quantlib
      L0: {snapshot_digests: exact, resolved_terms: exact, conventions_digest: exact}
      L1:
        pv: {abs_per_unit: [5.2e-10, 9.6e-10], rel: [2.0e-10, 6.6e-10]}
        cash: exact
        financing: exact
        quantity: {abs: [3.43e-3, 3.43e-3], rel: [1.135e-3, 1.135e-3], note: "worst on the marginal hedge legs (0.7 units) that only soak up the least-squares residual; the main 10Y leg (1195 units) differs by 2.6e-6"}
      L2:
        dv01: {rel: [2.4e-7, 1.1e-6]}
        gamma: {rel: [1.1e-6, 8.1e-5]}
        rate: {rel: [3.0e-15, 4.3e-15]}
        delta_ladder: {rel_per_bucket_max: [2.3e-4, 2.3e-4], rel_10Y: [1.3e-5, 1.3e-5], abs_max_per_unit: [0.028, 0.028], note: "the reference stack's bump ladder differs by its own bump size; rateslib against QuantLib DIRECTLY was measured on the suite swap run s1 (below): pv 7.0e-9, dv01 6.1e-7, gamma 2.9e-6, every layer but `unexplained` <= 5.5e-7"}
      L3_per_unit:
        carry: {rel: [1.2e-10, 1.2e-10]}
        roll: {rel: [1.3e-11, 1.7e-11]}
        delta: {rel: [8.8e-10, 5.4e-7]}
        convexity: {rel: [3.0e-7, 2.8e-7]}
        tay_delta: {rel: [2.4e-7, 1.1e-6]}
        tay_convexity: {rel: [1.1e-6, 8.1e-5]}
        unexplained: {rel: [3.7e-7, 8.8e-3], note: "MECHANISM (verified, tools/probe_unexplained_ratio.py): the QuantLib adapter takes its two directional derivatives by central differences of step h = 0.1 of the realised move, so its `delta` layer absorbs h^2 = 1% of the third-order remainder and its `unexplained` is (1 - h^2) = 0.99 times the true remainder (measured ratio 0.9896 .. 0.9905 over 55 rows; the same probe on the reference against itself gives exactly 1). The remainder is ~1e-5 of the explained P&L, so the absolute effect is 0.02 - 0.09 currency per unit"}
      L3_amounts: {rel: [1.14e-3, 1.14e-3], note: "amounts = per unit x quantity, so they inherit the L1 quantity difference exactly; unexplained (QuantLib) 1.0e-2"}
      L4: {equity: {rel: [3.1e-6, 3.1e-6], abs: [251.6, 252.0]}, cash: {rel: [1.4e-7, 1.4e-7]}, trade_pv: {abs: [2.0e-10, 6.6e-10]}, trade_cash: {abs: [1.3e-7, 8.1e-8]}, stats: {rel: [3.8e-6, 3.8e-6]}, stats_ratios: {rel: [2.8e-6 ex turnover]}}
    declared_in_base_config:   # `tieout.tolerances` of the showcase base: key -> value, reason
      - {key: "L1.quantity", value: {rel: 2e-3, floor: 1e-2}, reason: "hedge legs are sized by least squares from each stack's own measured ladder; the ladders agree to ~1e-4 per bucket, and the legs that only soak up the residual amplify that to 1.1e-3 (measured). 2e-3 is 1.8x the measurement"}
      - {key: "L3.*", value: {rel: 2e-3, floor: 1.0}, reason: "layer AMOUNTS are per-unit layers times the held size: they inherit the size difference above (1.14e-3 measured); the per-unit rows (`<layer>/unit`) isolate the library and agree to 1e-6 or better with the shipped tolerances"}
      - {key: "L3.unexplained", value: {rel: 1.5e-2, floor: 1.0}, reason: "QuantLib's `unexplained` is (1 - h^2) = 0.99 times the reference's because its adapter differences with step h = 0.1 (mechanism verified: ratio 0.9896 .. 0.9905); measured 8.8e-3 (showcase) and 1.000e-2 (suite s1) per unit; 1.5e-2 is 1.5 x h^2, tight enough to still catch a wrong layer definition"}
      - {key: "L4.trade_cash", value: {rel: 1e-6, floor: 1.0}, reason: "entry cash is -quantity x entry pv, and a par swap's entry pv is 1e-10 per unit: 1.3e-7 currency on 1195 units (measured); the shipped 1e-8 assumed unit-sized positions"}
    verdict: "with the declared tolerances every level passes for both pairs; without them the failures are exactly the size-driven rows listed above, each explained"

  suite_s1_swap_carry:
    what: "suite S1 (a swap carry strategy on the real EOD SOFR fixtures, 2024-01-02 .. 2024-06-28, 124 points, 6 positions of fixed size), three stacks through the CLI: `python -m pricebt tieout configs/suite/s1_swap_carry_eod.yaml --stack rateslib=... --stack quantlib=... --stack reference=... --reference reference` (PYTHONPATH=src;tests), output `results/tieout/s1_swap_carry`"
    self_test: passed
    measured:   # max relative difference, reference vs rateslib | reference vs quantlib | rateslib vs quantlib (results/tieout/s1_rl_vs_ql)
      L0: exact
      L1: {pv: [1.3e-9, 6.2e-9, 7.0e-9], quantity: exact, cash: exact, financing: exact}
      L2: {dv01: [2.8e-8, 5.9e-7, 6.1e-7], gamma: [1.1e-6, 2.3e-6, 2.9e-6], rate: [1.1e-15, 2.8e-15, 2.4e-15]}
      L3: {carry: [4.7e-10, 8.9e-10, 1.3e-9], roll: [8.4e-12, 1.1e-11, 1.1e-11], delta: [3.6e-11, 5.4e-7, 5.4e-7], convexity: [1.3e-6, 1.5e-6, 5.5e-7], unexplained: [2.9e-6, 1.00e-2, 1.00e-2], note: "the QuantLib unexplained is 0.99 x the others (mechanism above)"}
      L4: {equity: [1.4e-10, 9.0e-11, 5.3e-11], cash: [5.1e-10, 5.1e-10, 4.2e-14], trade_pv: [1.3e-9, 6.2e-9, 7.0e-9], stats: [4.8e-9, 3.0e-9, 1.8e-9], stats_ratios: [9.9e-11, 6.4e-11, 5.8e-11]}
    declared_in_base_config:
      - {key: "L3.unexplained", value: {rel: 1.5e-2, floor: 1.0}, reason: "see swap_book: QuantLib's directional derivatives use step h = 0.1, so its remainder is (1 - h^2) = 0.99 x the true one; measured 1.000e-2"}
    verdict: "reference vs rateslib passes with the shipped defaults, none widened; every pair passes with the one declaration above"

  suite_s05_bond:
    what: "suite S5 (a financed CT10 bond, same window and points), three stacks: configs/suite/s05_ust_ct10_financed.yaml with configs/adapters/{rateslib,quantlib,refstack}_bond.yaml; output `results/tieout/s05_ust_ct10_financed`, `results/tieout/s05_rl_vs_ql`"
    self_test: passed
    measured:   # reference vs rateslib | reference vs quantlib | rateslib vs quantlib
      L0: exact
      L1: {pv: [4.5e-15, 3.8e-15, 3.6e-15], financing: [4.6e-15, 3.8e-15, 3.6e-15], quantity: exact, cash: exact}
      L2: {dv01: [2.6e-12, 5.6e-12, 5.5e-12], gamma: [7.6e-9, 1.8e-8, 1.1e-8], rate: [1.0e-14, 2.3e-12, 2.3e-12]}
      L3: {carry: [2.4e-11, 2.5e-8, 2.5e-8], roll: [8.4e-9, 6.7e-9, 1.5e-8], delta: [2.9e-10, 1.4e-7, 1.4e-7], convexity: [7.7e-9, 1.7e-8, 1.2e-8], unexplained: [2.0e-6, 8.4e-6, 8.1e-6]}
      L4: {equity: [2.3e-12, 2.2e-12, 3.3e-13], trade_pv: [3.8e-15, 3.2e-15, 2.5e-15], stats: [4.3e-13, 2.0e-13, 3.1e-13], stats_ratios: [4.7e-13, 3.1e-13, 7.8e-13]}
    declared_in_base_config: []
    verdict: "all three stacks agree to better than 1e-7 relative at every level with the shipped defaults; nothing declared. Found by the L0 `resolved_terms` row: the QuantLib bond adapter reported only the security id (maturity None against the reference's date); it now reports coupon, maturity and notional like the others"

  toy_and_reference_selftests:
    what: "tests/test_tieout_selftest.py: the reference stack twice is exactly zero at every level; a flipped day count on one side is detected at L1 and located; a shifted calendar is detected in the resolved terms (L0) first; the reference stack matches hand-derived closed forms and the golden numbers to 1e-6 absolute"
    tolerances_used: "shipped defaults, none widened"
