[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pricebt"
version = "2.0.0"
description = "Event-driven backtester whose public API is a near 1:1 port of gs_quant.backtests; pricebt has no pricing or market data of its own (see docs/v2/DESIGN.md)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["numpy", "pandas>=2.0", "pyyaml", "python-dateutil", "tqdm"]

[project.optional-dependencies]
test = ["pytest", "nbformat", "nbclient", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]
