# Broken on purpose (check_asset fixture): par_rate returned in PERCENT-scale numbers while the
# config declares unit: bp (a 100x unit mismatch). Must FAIL BOTH swap_pv_identity AND
# swap_par_rate_atm.
# Copy of tests/assets/toy_usd_irs.yaml with ONE thing broken.
schema_version: 1
asset: bad_identity_par_pct
description: >
  Toy USD swap on the deterministic closed-form rates world in tests/toylib/rates.py. Test-only
  fixture, never shipped. Exercises build_on: each_market. Units: npv USD; dv01 USD per +1bp
  (payer > 0); rates in bp.
instrument: IRSwap
match: {notional_currency: USD}
currency: USD
unsupported_measures:
  IRDiscountDeltaParallel: "check_asset fixture: IRDiscountDeltaParallel is not wired in this one-error copy of toy_usd_irs"
  IRGamma: "check_asset fixture: IRGamma is not wired in this one-error copy of toy_usd_irs"
  IRVega: "check_asset fixture: IRVega is not wired in this one-error copy of toy_usd_irs"
  IRVanna: "check_asset fixture: IRVanna is not wired in this one-error copy of toy_usd_irs"
  IRVolga: "check_asset fixture: IRVolga is not wired in this one-error copy of toy_usd_irs"
  IRBasis: "check_asset fixture: IRBasis is not wired in this one-error copy of toy_usd_irs"
  IRXccyDelta: "check_asset fixture: IRXccyDelta is not wired in this one-error copy of toy_usd_irs"
  IRSpotRate: "check_asset fixture: IRSpotRate is not wired in this one-error copy of toy_usd_irs"
  IRAnnualImpliedVol: "check_asset fixture: IRAnnualImpliedVol is not wired in this one-error copy of toy_usd_irs"
  IRAnnualATMImpliedVol: "check_asset fixture: IRAnnualATMImpliedVol is not wired in this one-error copy of toy_usd_irs"
  IRDailyImpliedVol: "check_asset fixture: IRDailyImpliedVol is not wired in this one-error copy of toy_usd_irs"
  Theta: "check_asset fixture: Theta is not wired in this one-error copy of toy_usd_irs"
  ExpiryInYears: "check_asset fixture: ExpiryInYears is not wired in this one-error copy of toy_usd_irs"
  Annuity: "check_asset fixture: Annuity is not wired in this one-error copy of toy_usd_irs"
  Cashflows: "check_asset fixture: Cashflows is not wired in this one-error copy of toy_usd_irs"
defaults:
  pay_or_receive: Receive
  termination_date: 10y
  notional_currency: USD
  fixed_rate: ATM
  notional_amount: 1.0e6
imports: |
  import toylib.rates as tr
market:
  expr: 'tr.market(pricebt_date, "USD", pricebt_csa)'
  key: toy_usd_ois
resolve:
  expr: 'tr.resolve_swap(market, kwargs)'
trade:
  expr: 'tr.build_swap(market, resolved)'
  build_on: each_market
functions:
  npv:      {expr: 'tr.npv(market, trade)', unit: ccy}
  dv01:     {expr: 'tr.pv01(market, trade)', unit: ccy_per_bp}
  par_rate: {expr: 'tr.par_rate(market, trade) / 100.0', unit: bp}  # BROKEN: percent-scale value, declared bp
  gamma:             {expr: 'tr.gamma(market, trade)', unit: ccy_per_bp2}
  theta:             {expr: 'tr.theta(market, trade)', unit: ccy}
  year_fraction:     {expr: 'tr.year_fraction(market)', unit: decimal}
  cash_paid_to_date: {expr: 'tr.cash_paid_to_date(market, trade)', unit: ccy}
portfolio_functions:
  delta_ladder:
    expr: 'tr.delta_ladder(market, trades, weights, ("2Y", "5Y", "10Y", "30Y"))'
    unit: ccy_per_bp
    returns: buckets
    labels: {mkt_type: IR, mkt_asset: TOY-USD, mkt_class: OIS}
attributes:
  effective_date:   'resolved["effective_date"]'
  termination_date: 'resolved["termination_date"]'
  notional_amount:  'abs(resolved["notional"]) * pricebt_quantity'
size_attribute: notional_amount
risk_measures:
  Price: npv
  IRDelta: {scalar: dv01, bucketed: delta_ladder}
  IRFwdRate: par_rate
  IRGammaParallel: gamma
  IRTheta: theta
  YearFraction: year_fraction
  CashPaidToDate: cash_paid_to_date
