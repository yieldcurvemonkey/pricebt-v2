# Broken on purpose (check_asset fixture): ForwardPrice finances Price to the horizon but keeps a coupon paid before it (no
# coupon term). Must FAIL bond_forward_parity (on a date whose horizon holds a coupon) and nothing else.
# Copy of tests/assets/toy_usd_bond.yaml with ONE thing broken: regenerate_bond_fixtures.py rewrites it from the toy.
schema_version: 1
asset: bad_bond_forward_parity
description: >
  Toy USD fixed-coupon bond with repo financing on the deterministic rates world
  (tests/toylib/bond.py): a tiny bond master keyed by identifier, a flat curve plus a sinusoidal
  spread, GC repo = zero rate - 15bp (TOY 4.25 2034-11-15 trades 20bp special). Test-only fixture,
  never shipped; maps the whole strict Bond contract (docs/v2/BOND_DESIGN.md section 3).
  Weekdays only, standard settlement T+1. Units: Price USD, the holder-signed settlement-date
  value of the flows paid after settlement (a flow drops the weekday before it is paid; Cashflows
  lists the flows still in Price with that drop date); sensitivities USD per bp (bp^2) of the
  yield; yield, spreads and repo rate in bp; prices per 100 face (pct); Theta USD per calendar day
  at a constant yield over the step to the next weekday; repo simple ACT/360 on (1 - haircut) x
  Price(trade date), overnight or locked for the term (repo_term, repo_haircut kwargs).
instrument: Bond
match: {settlement_currency: USD}
currency: USD
defaults:
  buy_sell: Buy
  identifier: TOY 4.25 2034-11-15
  size: 1.0e6
  settlement_currency: USD
  repo_term: overnight
  repo_haircut: 0.02
imports: |
  import toylib.bond as tb
market:
  expr: 'tb.market(pricebt_date, "USD", pricebt_csa)'
  key: toy_usd_bond_curve
resolve:
  expr: 'tb.resolve_bond(market, kwargs)'
functions:
  npv:             {expr: 'tb.npv(market, trade, pricebt_date)', unit: ccy}   # Price and FairPremium; valued on the pricing date (a CloseMarket override passes no time)
  delta:           {expr: 'tb.delta(market, trade)', unit: ccy_per_bp}
  discount_delta:  {expr: 'tb.discount_delta(market, trade)', unit: ccy_per_bp}
  yield_dv01:      {expr: 'tb.yield_dv01(market, trade)', unit: ccy_per_bp}
  gamma:           {expr: 'tb.gamma(market, trade)', unit: ccy_per_bp2}
  zero_per_bp:     {expr: '0.0', unit: ccy_per_bp}    # ZERO_BY_CONVENTION: no vol / basis / xccy exposure
  zero_per_bp2:    {expr: '0.0', unit: ccy_per_bp2}
  zero_vol:        {expr: '0.0', unit: bp}            # ZERO_BY_CONVENTION: vol levels of a bullet bond
  yield_bp:        {expr: 'tb.yield_bp(market, trade)', unit: bp}
  spread_bp:       {expr: 'tb.spread_bp(market, trade)', unit: bp}
  theta_1d:        {expr: 'tb.theta_1d(market, trade)', unit: ccy}
  expiry_in_years: {expr: 'tb.expiry_in_years(market, trade)', unit: decimal}
  annuity:         {expr: 'tb.annuity(market, trade)', unit: ccy}
  cashflows:       {expr: 'tb.cashflows(market, trade)', unit: ccy, returns: frame, scale_columns: [payment_amount, notional]}
  forward_price:   {expr: 'tb.npv(market, trade) * (1 + tb._repo(market, trade) * (tb.horizon(tb.settle(market.curve.ref_date)) - tb.settle(market.curve.ref_date)).days / 360)', unit: ccy}   # MISTAKE: coupons before H kept
  premium_cents:   {expr: 'tb.premium_cents(market, trade, pricebt_date)', unit: pct}   # Price / |face| per 100
  local_annuity:   {expr: 'tb.local_annuity_in_cents(market, trade)', unit: decimal}
  compounded_rate: {expr: 'tb.compounded_fixed_rate(trade)', unit: bp}
  crif_ir_curve:   {expr: 'tb.crif_ir_curve(market, trade)', unit: ccy, returns: frame, scale_columns: [Amount]}
  dirty_price:     {expr: 'tb.dirty_price(market, trade, pricebt_date)', unit: pct}
  clean_price:     {expr: 'tb.clean_price(market, trade, pricebt_date)', unit: pct}
  accrued:         {expr: 'tb.accrued(market, trade, pricebt_date)', unit: ccy}
  mod_duration:    {expr: 'tb.modified_duration(market, trade)', unit: decimal}
  convexity:       {expr: 'tb.convexity(market, trade)', unit: decimal}
  days_to_settle:  {expr: 'tb.days_to_settlement(market, trade)', unit: number, scale_with_quantity: false}
  repo_rate:       {expr: 'tb.repo_rate(market, trade)', unit: bp}
  repo_haircut:    {expr: 'tb.repo_haircut(market, trade)', unit: decimal}
  financing:       {expr: 'tb.financing_to_date(market, trade)', unit: ccy}
  carry:           {expr: 'tb.carry(market, trade)', unit: ccy}
  roll_down:       {expr: 'tb.roll_down(market, trade)', unit: ccy}
portfolio_functions:
  delta_ladder:
    expr: 'tb.delta_ladder(market, trades, weights, ("2Y", "5Y", "10Y", "30Y"))'
    unit: ccy_per_bp
    returns: buckets
    labels: {mkt_type: IR, mkt_asset: TOY-USD, mkt_class: OIS}
  gamma_ladder:
    expr: 'tb.gamma_ladder(market, trades, weights, ("2Y", "5Y", "10Y", "30Y"))'
    unit: ccy_per_bp2
    returns: buckets
    labels: {mkt_type: IR, mkt_asset: TOY-USD, mkt_class: OIS}
  vega_cube:   # ZERO_BY_CONVENTION: a bullet bond has no vol cube
    expr: '{}'
    unit: ccy_per_bp
    returns: buckets
    labels: {mkt_type: IR VOL, mkt_asset: TOY-USD, mkt_class: SWAPTION}
  pnl_explain:   # PnlExplain: full revaluation from market to market_to by risk factor (IR_RISK_DESIGN section 8)
    expr: 'tb.pnl_explain(market, market_to, trades, weights, pricebt_date)'
    unit: ccy
    returns: buckets
attributes:
  notional_amount:  'abs(resolved["face"]) * pricebt_quantity'
  termination_date: 'resolved["maturity"]'
  settlement_date:  'resolved["settle0"]'
size_attribute: notional_amount
risk_measures:
  Price: npv
  IRDelta: {scalar: delta, bucketed: delta_ladder}
  IRDiscountDeltaParallel: discount_delta
  IRGammaParallel: gamma
  IRGamma: {bucketed: gamma_ladder}
  IRVega: {scalar: zero_per_bp, bucketed: vega_cube}
  IRVanna: zero_per_bp2
  IRVolga: zero_per_bp2
  IRBasis: zero_per_bp
  IRXccyDelta: zero_per_bp
  IRFwdRate: yield_bp
  IRSpotRate: yield_bp
  IRAnnualImpliedVol: zero_vol
  IRAnnualATMImpliedVol: zero_vol
  IRDailyImpliedVol: zero_vol
  Theta: theta_1d
  ExpiryInYears: expiry_in_years
  Annuity: annuity
  Cashflows: cashflows
  LightningDV01: yield_dv01
  LightningOAS: spread_bp
  ParSpread: spread_bp
  FairPremium: npv
  ForwardPrice: forward_price
  PremiumCents: premium_cents
  LocalAnnuityInCents: local_annuity
  CompoundedFixedRate: compounded_rate
  CRIFIRCurve: crif_ir_curve
  PnlExplain: pnl_explain
  CleanPrice: clean_price
  DirtyPrice: dirty_price
  AccruedInterest: accrued
  ModifiedDuration: mod_duration
  Convexity: convexity
  DaysToSettlement: days_to_settle
  RepoRate: repo_rate
  RepoHaircut: repo_haircut
  FinancingToDate: financing
  Carry: carry
  RollDown: roll_down
