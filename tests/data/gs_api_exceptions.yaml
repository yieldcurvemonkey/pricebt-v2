# Allowed differences between pricebt and the gs_quant 1.5.4 API snapshot
# (tests/data/gs_api_1_5_4.json / gs_instruments_1_5_4.json), consumed by
# tests/test_gs_api_parity.py (IMPLEMENTATION_PLAN.md P4.2; DESIGN.md section 12.3).
#
# Each entry is {symbol, aspect, reason, dev_id?, ...}, with a non-empty reason. `symbol` is an
# exact "gs_quant...." key from gs_api_1_5_4.json, or a glob pattern (matched with fnmatch) when the
# same difference recurs across many symbols. `aspect` is one of: signature, fields, methods,
# method_signature, properties, members, risk_measure, all (all = skip every aspect for this symbol
# -- existence-only, for a stub whose constructor intentionally does not match gs).
# An `all` entry with `pending: <phase>` (and no skip) instead excuses a symbol that is ABSENT from
# pricebt because a later phase adds it; once pricebt has the symbol, the entry itself fails, so
# it is deleted and the symbol compared like any other.
#
# Extra fields, by aspect:
#   signature/fields/method_signature: insert (pricebt-only names; removing them from pricebt's list
#                      must reproduce gs's list exactly, same order), missing (gs-only names pricebt's
#                      list legitimately omits, removed from gs's side before comparing -- the mirror
#                      image of insert), ignore_default (names whose default_repr may legitimately
#                      differ; name+kind must still match). A same-position rename (same kind/default,
#                      different name) is expressed as one `insert` name plus one `missing` name.
#   method_signature only: method (the method name this entry's insert/missing/ignore_default apply
#                      to; `symbol` is still the class, so several methods on the same class each get
#                      their own entry)
#   methods/properties: missing (gs names pricebt does not implement), extra (pricebt-only names
#                        gs does not have)
#   members: subset (true = pricebt's members must be a subset of gs's, not an exact match)
#   risk_measure: expect (a mapping over class/name/measure_type/asset_class/unit: pricebt must equal
#                 each value given here instead of the snapshot's; unnamed fields still match gs)
#
# Any difference not accounted for by an entry here fails the parity test -- including an in-scope
# symbol missing from pricebt entirely, a signature mismatch with no entry, or a DEV-marked
# deviation with no corresponding DESIGN section 11 row. Not listed here at all (need no entry,
# DESIGN.md section 12.3): the trailing keyword-only pricebt_asset/quantity_/kwargs are documented
# below anyway for the record, and the 2.1.17-only measures EqForwardSpot/FXDeltaHedgeLocalCcy/
# FXDeltaLocalCcy/FXGammaLocalCcy/FXThetaLocalCcy/FXVegaLocalCcy (absent from the 1.5.4 snapshot, so
# listed in its requested_not_found; the test checks their existence directly, they are never
# treated as "extra symbol not in snapshot" failures, and tests/test_risk_measures.py pins them).

# ------------------------------------------------------------------------- instruments (section 5.1)
- symbol: "gs_quant.instrument.*"
  aspect: signature
  insert: [pricebt_asset, quantity_, kwargs]
  reason: >
    DESIGN.md section 5.1: every generated instrument class appends the keyword-only
    pricebt_asset=None, quantity_=1.0, then **kwargs after every real gs field (name last, as in
    gs). The test additionally asserts this trailing triple is in this exact position (not just
    present anywhere), which is the stronger check this entry documents.

- symbol: "gs_quant.instrument.*"
  aspect: fields
  skip: true
  reason: >
    Generated instrument classes are plain classes with an exec-built __init__ (DESIGN.md section
    5.1), not dataclasses.dataclass -- "kind" (class vs dataclass) and "fields" are not comparable;
    the real check is the exact constructor signature (see the signature entry above).

- symbol: "gs_quant.instrument.*"
  aspect: methods
  missing: [compose, default_instance, from_asset_id, from_asset_ids, from_dict, from_instance,
            from_json, from_quick_entry, market, properties, properties_init, resolved,
            scale_in_place, schema, to_json]
  reason: >
    GS-server / asset-lookup / JSON-serialization surface: out of scope (section 2.3 non-goals,
    MUST-1). Only the object contract in DESIGN.md section 5.1 is ported: as_dict, calc, clone,
    dollar_price, flip, price, resolve, scale, to_dict (all present, verified). scale_in_place is
    additionally absent from gs's own Cash class, so its absence there is not even a gap.

- symbol: "gs_quant.instrument.*"
  aspect: properties
  missing: [metadata, provider, resolution_key, unresolved]
  extra: [asset_config, kwargs]
  reason: >
    DESIGN.md section 5.1 object contract: only kwargs, instrument_quantity and asset_config are
    properties. gs's metadata/provider are GS-server-only; resolution_key/unresolved are still part
    of pricebt's contract but as plain instance attributes assigned in __init__ (not @property), so
    they are invisible to a class-level introspection of either side's snapshot tool.

- symbol: "gs_quant.instrument.*"
  aspect: method_signature
  method: calc
  insert: [risk_measure_or_iterable]
  missing: [risk_measure]
  reason: >
    DESIGN.md section 5.1 object contract literally specs "calc(risk_measure_or_iterable, fn=None)"
    -- gs's `risk_measure` is renamed because pricebt's calc accepts a single RiskMeasure OR an
    iterable of them (both call conventions used across the engine); every call site in
    generic_engine.py passes it positionally, so the name has no behavioural effect.

- symbol: "gs_quant.instrument.*"
  aspect: method_signature
  method: clone
  insert: [kw]
  missing: [kwargs]
  reason: >
    DESIGN.md section 5.1 object contract specs "clone(**kw) -> Instrument"; gs's `**kwargs` is
    renamed to `**kw` (still VAR_KEYWORD, same position, no default to lose) -- a cosmetic choice
    with no observable effect (dataclasses.replace-style semantics), always called with keywords only.

- symbol: "gs_quant.instrument.*"
  aspect: method_signature
  method: to_dict
  missing: [encode_json]
  reason: >
    DESIGN.md section 5.1 object contract specs "to_dict() -> dict" with no parameters at all (it is
    as_dict() without 'name'). gs's `encode_json` param exists to interoperate with
    dataclasses_json's JSON encoding, which pricebt does not depend on or support (MUST-1; see the
    "backtests: dataclasses_json (MUST-1)" entry above for the same reasoning applied to the
    from_dict/from_json/schema/to_dict/to_json methods that whole entry excepts).

# ------------------------------------------------------------- backtests: dataclasses_json (MUST-1)
- symbol: "gs_quant.backtests.*"
  aspect: methods
  missing: [from_dict, from_json, schema, to_dict, to_json]
  reason: >
    dataclasses_json's dataclass_json mixin methods. pricebt does not depend on dataclasses_json
    (MUST-1) and does not serialise strategies/results to JSON (section 2.3 non-goal).

# ------------------------------------------------------------------- backtests: trigger reset (DEV-T10)
- symbol: "gs_quant.backtests.triggers.*TriggerRequirements"
  aspect: methods
  extra: [reset]
  dev_id: DEV-T10
  reason: >
    pricebt adds reset() to every trigger requirement (walking Aggregate/Not children) so trigger
    state does not leak across separate run_backtest() calls; the engine calls it at run start.

