# -------------------------------------------------------------------------------------------- session
- symbol: gs_quant.session.GsSession.use
  aspect: signature
  ignore_default: [environment_or_domain]
  reason: >
    pricebt.base.EnumBase overrides __repr__ to print the enum's value rather than
    ClassName.MEMBER (by design, for case-insensitive construction): repr(Environment.PROD) is "3",
    not gs's "<Environment.PROD: 3>". Name, kind and every other parameter's default match exactly.

# ------------------------------------------------------------------------------------------- datetime
- symbol: gs_quant.datetime.prev_business_date
  aspect: signature
  ignore_default: [dates]
  reason: >
    Both gs (gs_quant/datetime/date.py) and pricebt (src/pricebt/datetime/__init__.py) write this
    parameter's default as a bare `date.today()` call, which Python evaluates exactly ONCE, at
    function-definition/module-import time, not per call -- a real, intentional quirk this project
    keeps rather than "fixes" (it is not a DESIGN.md section 11 DEV row, and IMPLEMENTATION_PLAN.md
    section 9 says keep an unlisted gs behaviour rather than silently changing it). The frozen
    tests/data/gs_api_1_5_4.json snapshot therefore records whatever date gs_api_snapshot.py's
    process happened to import on (2026-09-27); pricebt's own live process imports on whatever date
    the test suite actually runs, so the two reprs are guaranteed to diverge on any day after the
    snapshot date. Parameter name/kind and every other parameter's default still must match exactly
    -- only the concrete date value baked into this one default is excepted.
