schema_version: 1
asset: toy_usd_swaption
description: >
  Toy USD swaption: Bachelier (normal) pricing with a flat vol over the toy rates world in
  tests/toylib/swaption.py. Test-only fixture, never shipped; mirrors DESIGN.md section 13's
  swaption extensibility walkthrough at toy scale. Units: npv USD; vega USD per +1bp of normal vol.
instrument: IRSwaption
match: {notional_currency: USD}
currency: USD
unsupported_measures:   # TEMPORARY (Phase A): Phase C maps the full contract (docs/v2/IR_RISK_DESIGN.md section 6.2)
  IRDelta: "toylib.swaption has no delta or delta-ladder function yet (Phase C adds them)"
  IRDiscountDeltaParallel: "toylib.swaption has no discount-only bump function yet (Phase C)"
  IRGammaParallel: "toylib.swaption has no gamma function yet (Phase C)"
  IRGamma: "toylib.swaption has no gamma ladder function yet (Phase C)"
  IRVega: {bucketed: "toylib.swaption has one flat vol per day and no vol-cube function yet (Phase C)"}
  IRVanna: "toylib.swaption has no vanna function yet (Phase C)"
  IRVolga: "toylib.swaption has no volga function yet (Phase C)"
  IRBasis: "single-curve toy world (no basis spread); the 0.0 function is not wired yet (Phase C)"
  IRXccyDelta: "single-currency toy swaption (no cross-currency basis); the 0.0 function is not wired yet (Phase C)"
  IRFwdRate: "toylib.swaption has no forward-rate function yet (Phase C)"
  IRSpotRate: "toylib.swaption has no spot-starting par rate function yet (Phase C)"
  IRAnnualImpliedVol: "toylib.swaption has no vol-level function yet (Phase C)"
  IRAnnualATMImpliedVol: "toylib.swaption has no vol-level function yet (Phase C)"
  IRDailyImpliedVol: "toylib.swaption has no vol-level function yet (Phase C)"
  Theta: "toylib.swaption has no one-day carry function yet (Phase C)"
  ExpiryInYears: "toylib.swaption has no years-to-expiry function yet (Phase C)"
  Annuity: "toylib.swaption has no annuity function yet (Phase C)"
  Cashflows: "toylib.swaption has no cashflows frame function yet (Phase C)"
  ProbabilityOfExercise: "toylib.swaption has no exercise-probability function yet (Phase C)"
defaults:
  pay_or_receive: Pay
  buy_sell: Buy
  expiration_date: 1y
  termination_date: 10y
  notional_currency: USD
  strike: ATM
  notional_amount: 1.0e6
imports: |
  import toylib.swaption as ts
market:
  expr: 'ts.market(pricebt_date, "USD", pricebt_csa)'
  key: toy_usd_swaption_vol
resolve:
  expr: 'ts.resolve_swaption(market, kwargs)'
functions:
  npv:  {expr: 'ts.npv(market, trade)', unit: ccy}
  vega: {expr: 'ts.vega(market, trade)', unit: ccy_per_bp}
attributes:
  expiration_date: 'resolved["expiration_date"]'
risk_measures:
  Price: npv
  IRVega: {scalar: vega}
