# Single source of truth for the zero-dependence guards (spec G-4, Appendix A).
# Adding a token is easy. REMOVING one needs a spec change first (spec 15) and a change-log entry.
schema_version: 1
doc: >-
  Data file read by tests/guards/scan.py. `match` is one of: substring (case-insensitive substring), word (case-insensitive, delimited by
  anything that is not a letter or digit, so an underscore counts as a delimiter), prefix (word start, any continuation).

# Z1: banned import roots (import statements at any depth, importlib.import_module / __import__ with a literal name).
import_roots:
  - rateslib
  - QuantLib
  - gs_quant
  - MDP
  - Query
  - Caching
  - TB
  - BT
  - RVUtils
  - SDRUtils
  - Simulation
  - definitions

# Z2 (+ Z5b): executable content of core = identifiers, non-docstring string literals, YAML keys and non-`doc` YAML values.
executable_tokens:
  - {token: rateslib, match: substring}
  - {token: quantlib, match: substring}
  - {token: arbs, match: word}
  - {token: rl_, match: prefix}
  - {token: ql_, match: prefix}
  - {token: usd_irs, match: substring}
  - {token: us_gb_tsy, match: substring}
  - {token: sum_instruments, match: substring}
  - {token: analytic_delta, match: substring}
  - {token: delta_usd, match: substring}
  - {token: nyc, match: word}
  - {token: SyntheticMDP, match: substring}
  - {token: citivelocity, match: substring}
  - {token: fedinvest, match: substring}
  - {token: webull, match: substring}
  - {token: api_kwargs, match: substring}
  - {token: risk_model, match: substring}
  - {token: carry_bps_running, match: substring}

# Z2 / S1: a schema must not require a library's argument names. Banned as KEYS under `args` / `kwargs` / `signature` mappings of a schema.
schema_arg_names: [curves, solver, fx, vol, leg, settlement, forward]

# Z4: no pricing convention in core outside the schema vocabulary (YAML, not scanned here), the labelled compat module and the labelled
# reference stack. Text tokens are matched on identifiers and non-docstring literals after removing spaces; `divisors` are numeric
# constants that must not appear as the right operand of a division.
convention_tokens:
  - act/360
  - act/365
  - act360
  - act365
  - /365
  - /360
  - day_count
  - compounding
  - modifier
  - payment_lag
  - settlement
convention_divisors: [360, 365, 365.25]
# Files (posix, relative to src/) exempt from Z4, each with the reason. A new entry needs a spec/change-log justification.
convention_allow:
  - {path: pricebt/backtests/*, reason: "gs_quant compatibility facade (C6): reproduces gs behaviours such as 1 + r/365 accrual; isolated and labelled"}
  - {path: pricebt/accrual.py, reason: "spec C1: cash accrual takes its basis (days per year) and compounding rule as EXPLICIT parameters with no default, so the caller states the convention; this is the only core module that names them"}
  - {path: pricebt/testing/toys.py, reason: "closed-form toy market: its time axis (elapsed / 365.25 days) is part of the toy's definition, not a library's pricing convention"}
  - {path: pricebt/testing/synthetic.py, reason: "library-free synthetic market: Nelson-Siegel time axis is part of the generator's definition; it emits plain snapshots"}
  - {path: pricebt/testing/refstack.py, reason: "dependency-free reference stack (spec A4): an adapter that happens to need no library; it implements the conventions its shared conventions block names, by definition"}

# Z5 / G1: ARBS SHOULD NOT be named even in src/ prose (comments, docstrings). This repo enforces it as a hard check.
prose_tokens:
  - {token: arbs, match: word}
