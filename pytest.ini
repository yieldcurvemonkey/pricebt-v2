[pytest]
testpaths = tests
addopts =
markers =
    core: unit and scenario tests on the toy library; no external dependency (the default for unmarked tests)
    notebook: executes a converted notebook (needs nbclient, ipykernel)
    live_arbs: needs a live external market-data checkout; opt-in (PRICEBT_LIVE_ARBS=1)
filterwarnings =
    error::DeprecationWarning:pricebt
