# NEGATIVE CONTROL 3: the ladder reducer lower-cases one key ('30Y' -> '30y'). pricebt's ladder keys are upper-case tenors, so the measure is refused and the audit records a NaN.
# Expected tie-out verdict: L2.delta_ladder.* is a `structure` failure (a value on one side, NaN on the other); it needs delta_ladder in the audit measures (Python API).
instruments:
  usd_sofr_ois:
    factory: "acme_adapter:swap"
    bind:
      delta_ladder:
        target: {method: delta_ladder}
        kwargs: {ctx: "@ctx", tenors: [3M, 6M, 1Y, 2Y, 3Y, 5Y, 7Y, 10Y, 15Y, 20Y, 30Y]}
        keys: [3M, 6M, 1Y, 2Y, 3Y, 5Y, 7Y, 10Y, 15Y, 20Y, 30Y]
        reduce: "acme_mistakes:lowercase_last_key"   # the shipped reducer is `acme_ladder_to_tenor_dict`
        sign: -1.0
market:
  pricers:
    primary: {wrap: "acme_adapter:wrap"}
