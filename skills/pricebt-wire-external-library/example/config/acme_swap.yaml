# Stack overlay: the acmelib adapter for a base config with the swap instrument `usd_sofr_ois` and the pricer role `primary`.
# An overlay may set ONLY instruments.<name>.factory, instruments.<name>.bind and market.pricers.<role>.wrap (config/stacks.py rejects anything else, naming the path).
# It cannot set `registry`: the BASE config must list `acme_adapter` under registry.allow (see acme_tieout_base.yaml), otherwise both dotted paths below fail with CFG-ALLOW.
# No `bind:` here: the Kit's own default block (acme_adapter.swap.SWAP_BIND) is the binding. A `bind:` in an overlay is merged over the Kit's by NAME (one entry replaces one
# binding); the base's own `bind` block, if it had one, is REPLACED by the overlay's whole `bind`.
instruments:
  usd_sofr_ois: {factory: "acme_adapter:swap"}
market:
  pricers:
    primary: {wrap: "acme_adapter:wrap"}
