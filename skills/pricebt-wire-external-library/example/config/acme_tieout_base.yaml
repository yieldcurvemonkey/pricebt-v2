doc: >
  The BASE config of the acmelib tie-out: three swaps on the SYNTHETIC market, held over a month that contains two US holidays (2024-05-27, 2024-06-19), so a wrong
  calendar moves dates the tie-out can see. The library-free reference stack is the default library; acmelib is a STACK OVERLAY (acme_swap.yaml) that sets only
  instruments.usd_sofr_ois.factory / .bind and market.pricers.primary.wrap.
  Two things here are what an EXTERNAL adapter package needs from its base config:
    registry.allow   dotted paths (factory, wrap, a `function` binding target, a reducer path) are imported only under an allowed prefix: `pricebt` is always allowed,
                     everything else (acme_adapter, and acme_mistakes for the negative controls) must be listed HERE. An overlay cannot set `registry`.
    the trades       two different notionals and both directions, so a constant `scale` standing in for `notional / 1e6` or a wrong sign cannot cancel.
  Run it from the project root with the example on the path:
    $env:PYTHONPATH = "src;tests;skills\pricebt-wire-external-library\example"
    python -m pricebt tieout skills\pricebt-wire-external-library\example\config\acme_tieout_base.yaml --stack reference=configs\adapters\refstack_swap.yaml --stack acme=skills\pricebt-wire-external-library\example\config\acme_swap.yaml
registry: {allow: [acme_adapter, acme_mistakes]}
backtest:
  tz: America/New_York
  calendar: {holidays: &holidays [2024-05-27, 2024-06-19]}   # the grid skips the holidays the market does not serve
  date_policy: close
  grid: {start: 2024-05-24, end: 2024-06-21, freq: 1b}
  progress: {show: false}
  attribution: {layers: [carry, roll, delta, convexity], cadence: eod}
  measures: [dv01]
market:
  mdps:
    rates:
      type: "pricebt.testing.synthetic:SyntheticMarket"
      kwargs:
        start: 2024-01-02
        end: 2024-12-31
        seed: 7
        calendar: {$call: "pricebt.timeutil:Calendar", kwargs: {holidays: *holidays}}   # the calendar `usd_fed` the snapshots carry
  pricers:
    primary: {mdp: rates, wrap: "pricebt.testing.refstack:wrap"}
instruments:
  usd_sofr_ois:
    asset_class: swap
    factory: "pricebt.testing.refstack:swap"
    conventions:
      calendar: usd_fed
      spot_lag_days: 2
      day_count: act360
      frequency: annual
      business_day_convention: modified_following
      payment_lag_days: 2
      compounding: daily_compounded
      stub: short_front
      end_of_month: false
      fixing_lag_days: 1
      time_accrual: lump
strategy:
  triggers:
    - type: periodic
      frequency: 1m
      actions:
        - {type: add_trade, priceables: {instrument: usd_sofr_ois, name: recv10y, terms: {side: receive, maturity: 10Y, notional: 1e7, fixed_rate: par}}, trade_duration: 1m}
        - {type: add_trade, priceables: {instrument: usd_sofr_ois, name: pay5y, terms: {side: pay, maturity: 5Y, notional: 5e6, fixed_rate: par}}, trade_duration: 1m}
        - {type: add_trade, priceables: {instrument: usd_sofr_ois, name: pay_short, terms: {side: pay, maturity: 2024-06-12, notional: 2.5e7, fixed_rate: 4.1}}, trade_duration: 1m}
