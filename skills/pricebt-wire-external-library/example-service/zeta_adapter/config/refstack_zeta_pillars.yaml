# SECOND overlay for the REFERENCE stack of a zeta tie-out (use it after the shipped one:
#   --stack reference=configs/adapters/refstack_swap.yaml,skills/pricebt-wire-external-library/example-service/zeta_adapter/config/refstack_zeta_pillars.yaml).
# It changes NOTHING of the reference's arithmetic: it only passes the same `tenors` list to the reference's dv01, gamma and delta_ladder that zeta's risk uses (zeta's par-swap risk curve has
# TWELVE pillars, 1M 3M 6M 1Y 2Y 3Y 5Y 7Y 10Y 15Y 20Y 30Y: ZETA_DOCS section 6, fixed, not configurable; the reference's default has eleven, no 1M). Two risk numbers on different pillar
# sets are two different measures (a seasoned 2Y swap: dv01 differs by 1.05e-4 relative, the shipped tolerance is 1e-4; a swap with 2 weeks left: 6.6e-3), so a tie-out of the WIRING (units, signs, keys)
# puts both stacks on the same risk basis. The size of the basis difference itself is measured in the README of the example (section "The pillar-set caveat") and pinned by a test. The binding entries are the
# reference Kit's own (`refstack.SWAP_BIND`) with the tenors changed: nothing else.
instruments:
  usd_sofr_ois:
    bind:
      dv01: {target: {method: dv01}, kwargs: {ctx: "@ctx", tenors: [1M, 3M, 6M, 1Y, 2Y, 3Y, 5Y, 7Y, 10Y, 15Y, 20Y, 30Y]}}
      gamma: {target: {method: gamma}, kwargs: {ctx: "@ctx", tenors: [1M, 3M, 6M, 1Y, 2Y, 3Y, 5Y, 7Y, 10Y, 15Y, 20Y, 30Y]}}
      delta_ladder:
        target: {method: delta_ladder}
        kwargs: {ctx: "@ctx", tenors: [1M, 3M, 6M, 1Y, 2Y, 3Y, 5Y, 7Y, 10Y, 15Y, 20Y, 30Y]}
        keys: [1M, 3M, 6M, 1Y, 2Y, 3Y, 5Y, 7Y, 10Y, 15Y, 20Y, 30Y]
        reduce: dict_of_floats
