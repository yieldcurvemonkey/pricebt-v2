doc: >
  The BASE config of the zeta tie-out: four swaps on the SYNTHETIC market (library-free, so every stack consumes IDENTICAL snapshots: L0 snapshot_digests), held over a month that contains two
  US holidays (2024-05-27, 2024-06-19), so a wrong calendar moves dates the tie-out can see. The library-free reference stack is the default library; zeta is a STACK OVERLAY
  (zeta_swap.yaml, next to this file) that sets only instruments.usd_sofr_ois.factory / .bind and market.pricers.primary.wrap. zeta serves no market data: there is no provider of its own.
  registry.allow lists the adapter package (and zeta_mistakes, the deliberately wrong pieces of the negative controls); an overlay cannot set `registry`.
  Run it from the repository root (the reference stack needs the second overlay because zeta's risk pillars are fixed: see the README of the example):
    $env:PYTHONPATH = "src;tests;skills\pricebt-wire-external-library\example-service"
    $ex = "skills\pricebt-wire-external-library\example-service\zeta_adapter\config"
    python -m pricebt tieout $ex\zeta_tieout_base.yaml --stack "reference=configs\adapters\refstack_swap.yaml,$ex\refstack_zeta_pillars.yaml" --stack zeta=$ex\zeta_swap.yaml --reference reference
  (quote the comma-joined list in PowerShell: unquoted, PowerShell does not expand `$ex` inside a token that contains a comma, so the run stops with `[CFG-FILE] config file not found: ...\$ex\refstack_zeta_pillars.yaml`, exit 2)
registry: {allow: [zeta_adapter, zeta_mistakes]}
backtest:
  tz: America/New_York
  calendar: {holidays: &holidays [2024-05-27, 2024-06-19]}   # the grid skips the holidays the market does not serve
  date_policy: close
  grid: {start: 2024-05-24, end: 2024-06-21, freq: 1b}
  progress: {show: false}
  attribution: {layers: [carry, roll, delta, convexity], cadence: eod}
  measures: [dv01]
market:
  mdps:
    rates:
      type: "pricebt.testing.synthetic:SyntheticMarket"
      kwargs:
        start: 2024-01-02
        end: 2024-12-31
        seed: 7
        calendar: {$call: "pricebt.timeutil:Calendar", kwargs: {holidays: *holidays}}   # the calendar `usd_fed` the snapshots carry
  pricers:
    primary: {mdp: rates, wrap: "pricebt.testing.refstack:wrap"}
instruments:
  usd_sofr_ois:
    asset_class: swap
    factory: "pricebt.testing.refstack:swap"
    conventions:
      calendar: usd_fed
      spot_lag_days: 2
      day_count: act360
      frequency: annual
      business_day_convention: modified_following
      payment_lag_days: 2
      compounding: daily_compounded
      stub: short_front
      end_of_month: false
      fixing_lag_days: 1
      time_accrual: lump
strategy:
  triggers:
    - type: periodic
      frequency: 1m
      actions:
        - {type: add_trade, priceables: {instrument: usd_sofr_ois, name: recv10y, terms: {side: receive, maturity: 10Y, notional: 1e7, fixed_rate: par}}, trade_duration: 1m}
        - {type: add_trade, priceables: {instrument: usd_sofr_ois, name: pay5y, terms: {side: pay, maturity: 5Y, notional: 5e6, fixed_rate: par}}, trade_duration: 1m}
        - {type: add_trade, priceables: {instrument: usd_sofr_ois, name: pay2y_seasoned, terms: {side: pay, effective: 2023-06-12, maturity: 2Y, notional: 2e7, fixed_rate: 3.9}}, trade_duration: 1m}
        - {type: add_trade, priceables: {instrument: usd_sofr_ois, name: recv3y_fwd_offpar, terms: {side: receive, effective: 6M, maturity: 3Y, notional: 1.5e7, fixed_rate: 4.6}}, trade_duration: 1m}
