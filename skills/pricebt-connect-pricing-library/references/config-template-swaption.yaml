  delta/gamma <CCY> per bp (bp^2) of the underlying forward swap rate; vega/vanna/volga per bp (bp^2) of NORMAL
  vol; rates and vols in bp; Theta <CCY> per calendar day. Physically settled; after expiry an exercised leg is
  the underlying swap and an unexercised one is 0.
instrument: IRSwaption
