  # ================= 1. PRIMITIVES: the only calls into YOUR library. Replace every body. =================
  # Boundary conventions: dates datetime.date; rates and vols DECIMAL (0.0425; a normal vol of 80bp = 0.0080);
  # PVs in `currency:`, holder-signed, per leg built from the resolved (signed) notional; shifts h DECIMAL.

  def lib_market(d):
