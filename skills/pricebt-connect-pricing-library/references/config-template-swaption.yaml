# Asset-config TEMPLATE: an IRSwaption (European, physically settled) on ANY pricing library, mapping the WHOLE
# IR measure contract (src/pricebt/risk/contracts.py; docs/v2/IR_RISK_DESIGN.md section 2 and section 00;
# docs/v2/IR_STRICT_CONTRACT.md: an IRSwaption config must MAP every contract measure, it cannot declare one).
# Same layout as config-template.yaml (the swap): PRIMITIVES (your library) -> RECIPES (pricebt's contract).
#
# Copy it to configs/assets/<asset>.yaml. It LOADS as-is; pricing it raises NotImplementedError("TODO ...") at
# the first primitive you have not filled.
#   1. PRIMITIVES (code: section 1) are the ONLY calls into your library. Replace every body.
#   2. RECIPES (code: section 2) derive every contract measure. Keep them, or map a native call converted to
#      the pricebt unit/sign (vega per bp of NORMAL vol; a lognormal vega is not a rescale: see
#      skills/pricebt-asset-config-cookbook/references/patterns.md, pattern 18) and check it once against the recipe.
#   3. No "unsupported" escape hatch: every contract measure must be mapped. Only IRBasis (one curve) and
#      IRXccyDelta (one currency) may be a literal 0.0 (contracts.ZERO_BY_CONVENTION); a swaption's vega and vol
#      levels are real. Leave a measure out and the load error lists every gap with a paste-ready mapping skeleton.
# pricebt never reads buy_sell or pay_or_receive itself: resolve folds buy_sell into the signed notional, and the
# trade is a tuple of legs (a Straddle = payer + receiver), so every recipe below prices a straddle correctly.
# Runnable reference: tests/assets/toy_usd_swaption.yaml (tests/toylib/swaption.py, Bachelier on a flat vol).
# Proof of this template: tests/skills/test_skill_connect_example.py fills the primitives with the toy library.
