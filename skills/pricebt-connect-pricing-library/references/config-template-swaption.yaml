  def lib_normal_vol(m, leg):
      """DECIMAL annualised NORMAL implied vol at the leg's strike (IRAnnualImpliedVol). A lognormal / SABR
      surface: return bachelier_implied_vol(lib_pv(m, leg) / lib_annuity(m, leg), F, K, T, is_payer) below,
      never sigma_LN * F. After expiry: the last live value (e.g. read on lib_market(expiration_date))."""
      _todo("lib_normal_vol(m, leg)")

  def lib_atm_normal_vol(m, leg):
