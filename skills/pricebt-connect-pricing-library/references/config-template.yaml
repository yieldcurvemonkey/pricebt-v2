# Asset-config TEMPLATE: an IRSwap (vanilla fixed-float swap) on ANY pricing library, mapping the WHOLE
# IR measure contract (src/pricebt/risk/contracts.py; docs/v2/IR_RISK_DESIGN.md section 2 and section 00;
# docs/v2/IR_STRICT_CONTRACT.md: an IRSwap config must MAP every contract measure, it cannot declare one).
# Swaption and bond versions: config-template-swaption.yaml, config-template-bond.yaml (same layout).
#
# Copy it to configs/assets/<asset>.yaml. It LOADS as-is (load_asset never runs imports/code), and pricing it
# raises NotImplementedError("TODO ...") at the first primitive you have not filled, so fill it step by step:
#   1. PRIMITIVES (code: section 1) are the ONLY calls into your library. Replace every body. Each docstring
#      says exactly what pricebt needs back (unit, sign, date type).
#   2. RECIPES (code: section 2) derive every contract measure from the primitives. Keep them, OR, where your
#      library computes a measure natively, point that function's expr at the native call converted to the
#      pricebt unit and sign (comment it: # vendor: X -> pricebt: Y) and check it once against the recipe.
#   3. There is no "unsupported" escape hatch for an IRSwap: every contract measure must be mapped, and a
#      literal constant is honest only where the contract defines the value as 0 (vol measures, IRBasis on
#      one curve, IRXccyDelta in one currency: contracts.ZERO_BY_CONVENTION). A measure your library has no
#      call for is still computable from the primitives below (bump-and-reprice); if you leave one out, the
#      load error lists every gap and ends with a paste-ready mapping skeleton.
# Runnable reference implementation of this contract on a closed-form toy library:
#   tests/assets/toy_usd_irs_full.yaml (tests/toylib/rates.py + tests/toylib/irrisk.py).
# Proof that THIS template is complete and its recipes are right (fills the primitives with the toy library
# and compares every contract measure with the toy config): tests/skills/test_skill_connect_example.py
