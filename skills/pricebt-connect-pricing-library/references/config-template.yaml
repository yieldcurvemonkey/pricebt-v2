      _todo("lib_at(m, d)")

  def lib_pillars(m):
      """Your curve's pillar labels as plain tenors, e.g. ("2Y", "5Y", "10Y", "30Y"). For CRIFIRCurve each
      must be a SIMM tenor (2W 1M 3M 6M 1Y 2Y 3Y 5Y 10Y 15Y 20Y 30Y); bump at those if yours differ."""
      _todo("lib_pillars(m)")

  def lib_shift_pillar(m, pillar, h):
      """Market m with ONLY `pillar` shifted by h (a key-rate bump of your curve inputs)."""
      _todo("lib_shift_pillar(m, pillar, h)")

  # ============ 2. RECIPES: the contract from the primitives (keep, or map a native call instead) ============
  H = 1e-4                                   # 1bp, decimal
  _ATM = re.compile(r"^\s*(?:atmf?|a)\s*(?:([+-])\s*(\d+(?:\.\d+)?))?\s*$", re.I)   # 'ATM', 'ATM+25', 'A-10' (bp)
  _TENOR = re.compile(r"^\s*\d+\s*[dwmy]\s*$", re.I)

  def _pin(m, base, x):
      """'spot' or None -> base; a tenor -> base + tenor (library calendar); a date stays a date."""
      if x is None or (isinstance(x, str) and x.strip().lower() == "spot"):
          return base
      if isinstance(x, str) and _TENOR.match(x):
          return lib_add_tenor(m, base, x.strip().upper())
      if isinstance(x, str):
          raise ValueError(f"unsupported date {x!r} (use a tenor such as '10y', 'spot', or a date)")
      return x.date() if isinstance(x, _dt.datetime) else x

  def _direction(por):
      s = str(getattr(por, "value", por)).strip().lower()      # pricebt enum (value 'Pay'/'Rec') or a string
      if s in ("pay", "payer"):
          return 1.0
      if s in ("rec", "receive", "receiver"):
          return -1.0
      raise ValueError(f"pay_or_receive must be Pay or Receive for a swap, got {por!r}")

  def resolve_swap(m, kw):
      """Runs ONCE, on the trade date's market. Returns only plain, ABSOLUTE terms: dates, a DECIMAL strike,
      a signed notional (payer > 0). A tenor or 'ATM' left as a string never ages: silently wrong P&L."""
      start = _pin(m, lib_spot_date(m), kw.get("effective_date"))
      end = _pin(m, start, kw["termination_date"])
      fr = kw.get("fixed_rate", "ATM")
      mm = _ATM.match(fr) if isinstance(fr, str) else None
      if mm:
          k = lib_par_rate(m, start, end) + float(mm.group(2) or 0.0) * (-1.0 if mm.group(1) == "-" else 1.0) * H
      elif isinstance(fr, str):
          raise ValueError(f"unsupported fixed_rate {fr!r} (use 'ATM', 'ATM+x' in bp, or a decimal)")   # '=solvefor(...)': gs server grammar
      else:
          k = float(fr)                      # gs fixed_rate is DECIMAL
      return {"effective_date": start, "termination_date": end, "fixed_rate": k,
              "notional": float(kw["notional_amount"]) * _direction(kw["pay_or_receive"])}

  def pv(m, t):
      return lib_pv(m, t)

  def own_rate_bp(m, t):
      return lib_own_rate(m, t) * 1e4        # decimal -> bp

  def _points(m, t, h):
      """(PVs, own rates in bp) on the -h, 0, +h parallel shifts."""
      ms = (lib_shift(m, -h), m, lib_shift(m, h))
      return [pv(x, t) for x in ms], [own_rate_bp(x, t) for x in ms]

  def own_rate_delta(m, t, bump_bp=None, method=None):
      """IRDelta scalar (pricebt DEV-I12): the TOTAL derivative of PV w.r.t. the own rate r along the parallel
      shift, per bp of r: [PV(+h) - PV(-h)] / [r(+h) - r(-h)]. bump_bp and method are the request's bump_size
      (read as bp; gs's default is a centred 1bp) and finite_difference_method."""
      (n_dn, n_0, n_up), (r_dn, r_0, r_up) = _points(m, t, float(bump_bp or 1.0) * H)
      how = str(getattr(method, "value", method) or "Centered")
      if how == "Up":
          num, den = n_up - n_0, r_up - r_0
      elif how == "Down":
          num, den = n_0 - n_dn, r_0 - r_dn
      else:                                  # Centered, CenteredSecondOrder
          num, den = n_up - n_dn, r_up - r_dn
      return num / den if den else 0.0       # a dead trade: 0.0 (never NaN)

  def own_rate_gamma(m, t):
      """IRGammaParallel: the chain-rule second derivative on the same bumps, per bp^2 of r. NEVER d(pv01)/dr
      (that is half the gamma at the money)."""
      (n_dn, n_0, n_up), (r_dn, r_0, r_up) = _points(m, t, H)
      dr = r_up - r_dn
      if dr == 0.0:
          return 0.0
      delta = (n_up - n_dn) / dr
      return (n_up + n_dn - 2.0 * n_0 - delta * (r_up + r_dn - 2.0 * r_0)) / (dr / 2.0) ** 2

  def discount_only_delta(m, t):
      """IRDiscountDeltaParallel: PV change per +1bp of the discount curve only (central difference)."""
      return (pv(lib_shift_discount(m, H), t) - pv(lib_shift_discount(m, -H), t)) / 2.0

  def theta_one_day(m, t, d):
      """Theta (pricebt DEV-I15): one calendar day with forwards fixed, ccy PER DAY, total return:
      PV(d+1) on the translated market + the flows PV drops in (d, d+1] - PV(d)."""
      d1 = d + _dt.timedelta(days=1)
      cash = sum(r["payment_amount"] for r in lib_cashflows(m, t) if r["payment_date"] <= d1)
      return pv(lib_translate(m, 1), t) + cash - pv(m, t)

  def years_to(end, d):
      """ExpiryInYears (pricebt DEV-I17): max(end - d, 0) in calendar days / 365."""
      return max((end - d).days, 0) / 365.0

  def key_rate_ladder(m, trades, weights):
      """IRDelta bucketed: a central 1bp bump of each pillar, weighted over the book, ccy per +1bp. It sums to
      the PARALLEL curve delta, which differs from the own-rate scalar by dr/ds (R2-2)."""
      out = {}
      for p in lib_pillars(m):
          up, dn = lib_shift_pillar(m, p, H), lib_shift_pillar(m, p, -H)
          out[p] = sum(w * (pv(up, t) - pv(dn, t)) / 2.0 for t, w in zip(trades, weights))
      return out

  def diagonal_gamma_ladder(m, trades, weights):
      """IRGamma bucketed (pricebt DEV-I13: the diagonal only), ccy per bp^2 at each pillar."""
      base = [pv(m, t) for t in trades]
      out = {}
      for p in lib_pillars(m):
          up, dn = lib_shift_pillar(m, p, H), lib_shift_pillar(m, p, -H)
          out[p] = sum(w * (pv(up, t) + pv(dn, t) - 2.0 * b) for t, w, b in zip(trades, weights, base))
      return out

  # --- the rest of the strict contract (docs/v2/IR_STRICT_CONTRACT.md R3-1) ---
  SIMM_TENORS = ("2w", "1m", "3m", "6m", "1y", "2y", "3y", "5y", "10y", "15y", "20y", "30y")
  CRIF_COLUMNS = ["RiskType", "Qualifier", "Bucket", "Label1", "Label2", "Amount", "AmountCurrency"]
  CRIF_BUCKET = "1"                          # TODO: the SIMM volatility group of your currency ("1": regular, e.g. USD, EUR)
  CRIF_SUBCURVE = "OIS"                      # TODO: Label2, your projection sub-curve ("OIS", "SOFR", "Libor3m", ...)

  def par_spread_bp(m, t, r):
      """ParSpread: K - par, in bp -- the floating-leg spread that makes PV 0 when both legs share one curve
      and one schedule. Same for payer and receiver. If your legs differ, solve PV(spread) = 0 on the
      floating leg instead (or map the library's par spread, converted to bp)."""
      return r["fixed_rate"] * 1e4 - own_rate_bp(m, t)

  def fair_premium(m, t):
      """FairPremium: PV / DF(premium settlement), settlement = your spot date (no spot lag: PV itself)."""
      return pv(m, t) / lib_discount_factor(m, lib_spot_date(m))

  def forward_value(m, t, end, d):
      """ForwardPrice: PV / DF(final date), the date ExpiryInYears counts to; PV on or after it."""
      return pv(m, t) / lib_discount_factor(m, end) if d < end else pv(m, t)

  def compounded_rate_bp(k, f):
      """CompoundedFixedRate: (1 + K/f)^f - 1 in bp (an annual leg, f = 1: K itself)."""
      return ((1.0 + k / f) ** f - 1.0) * 1e4

  def crif_frame(m, t, ccy):
      """CRIFIRCurve: the trade's key-rate ladder as SIMM CRIF rows (Label1 = the pillar in lower case), so
      sum(Amount) = the IRDelta ladder's sum; an empty frame once nothing is left (a dead swap)."""
      rows = []
      for p, a in key_rate_ladder(m, [t], [1.0]).items():
          label = p.strip().lower()
          if label not in SIMM_TENORS:
              raise ValueError(f"pillar {p!r} is not a SIMM tenor {SIMM_TENORS}: bump at the SIMM tenors for CRIF")
          if a:
              rows.append(("Risk_IRCurve", ccy, CRIF_BUCKET, label, CRIF_SUBCURVE, a, ccy))
      return pd.DataFrame(rows, columns=CRIF_COLUMNS)

  def pnl_explain(m, m_to, trades, weights, d, ccy):
      """PnlExplain: full revaluation from market m to m_to, both seen from the pricing date d (no time
      passes), weighted. A swap has one risk factor, the curve: IR = the whole move, CROSSES = 0."""
      a, b = lib_at(m, d), lib_at(m_to, d)
      ir = sum(w * (pv(b, t) - pv(a, t)) for t, w in zip(trades, weights))
      return [{"mkt_type": "IR", "mkt_asset": ccy, "value": ir}, {"mkt_type": "CROSSES", "value": 0.0}]

