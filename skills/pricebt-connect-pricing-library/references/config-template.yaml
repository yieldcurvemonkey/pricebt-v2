  delta:           {expr: 'own_rate_delta(market, trade, pricebt_bump_size, pricebt_finite_difference_method)', unit: ccy_per_bp}
  discount_delta:  {expr: 'discount_only_delta(market, trade)', unit: ccy_per_bp}
  gamma:           {expr: 'own_rate_gamma(market, trade)', unit: ccy_per_bp2}
  zero_per_bp:     {expr: '0.0', unit: ccy_per_bp}    # a swap has no vol exposure: vega 0.0 (R2-8); single-curve,
  zero_per_bp2:    {expr: '0.0', unit: ccy_per_bp2}   # single-currency: basis/xccy 0.0. TODO: map real basis/xccy risk if you have it
  zero_vol:        {expr: '0.0', unit: bp}            # vol levels 0.0 by convention, so mixed swap+swaption books work
  par_rate:        {expr: 'own_rate_bp(market, trade)', unit: bp}
  spot_rate:       {expr: 'lib_spot_rate(market, trade) * 1e4', unit: bp}   # decimal -> bp
  theta_1d:        {expr: 'theta_one_day(market, trade, pricebt_date)', unit: ccy}
  expiry_in_years: {expr: 'years_to(resolved["termination_date"], pricebt_date)', unit: decimal}
  annuity:         {expr: 'lib_annuity(market, trade)', unit: ccy}
  cashflows:       {expr: 'lib_cashflows(market, trade)', unit: ccy, returns: frame, scale_columns: [payment_amount]}
  par_spread:      {expr: 'par_spread_bp(market, trade, resolved)', unit: bp}
  fair_premium:    {expr: 'fair_premium(market, trade)', unit: ccy}
  forward_price:   {expr: 'forward_value(market, trade, resolved["termination_date"], pricebt_date)', unit: ccy}
  premium_cents:   {expr: 'pv(market, trade) / abs(resolved["notional"]) * 1e4', unit: bp}          # bp of |notional| (intensive)
  local_annuity:   {expr: 'lib_annuity(market, trade) / abs(resolved["notional"])', unit: decimal}  # Annuity / |notional|
  compounded_rate: {expr: 'compounded_rate_bp(resolved["fixed_rate"], lib_fixed_frequency(trade))', unit: bp}
  crif:            {expr: 'crif_frame(market, trade, pricebt_currency)', unit: ccy_per_bp, returns: frame, scale_columns: [Amount]}
