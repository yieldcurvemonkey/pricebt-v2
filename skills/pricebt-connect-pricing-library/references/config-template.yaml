  # (1bp = 1e-4). Never define a helper named market, trade, kwargs, resolved, trades, weights or market_to.

  def lib_market(d):
      """The market (curve set) for the close of date d, or None when the library has no data for d
      (weekend, holiday, gap, outside history). Catch ONLY the library's no-data exceptions, e.g.
