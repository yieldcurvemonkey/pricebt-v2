# Asset-config TEMPLATE: a fixed-coupon Bond on ANY pricing / bond-analytics library, mapping the WHOLE IR
# measure contract (src/pricebt/risk/contracts.py; docs/v2/IR_RISK_DESIGN.md section 2 and section 00).
# Same layout as config-template.yaml (the swap): PRIMITIVES (your library) -> RECIPES (pricebt's contract).
#
# A Bond's own rate is its YIELD TO MATURITY (pricebt DEV-I12): IRFwdRate = IRSpotRate = the yield, and the IRDelta
# scalar / IRGammaParallel are dPrice/dy and d2Price/dy2 (yield bumps: every bond library has price-from-yield).
# A long bond has IRDelta < 0. gs Bond has `size` (no notional_amount) and `buy_sell`: resolve folds
# buy_sell x sign(size) into a signed face amount, and the attributes below give the engine a notional_amount.
#
# Copy it to configs/assets/<asset>.yaml. It LOADS as-is; pricing it raises NotImplementedError("TODO ...") at
# the first primitive you have not filled. Fill the PRIMITIVES; keep the RECIPES or map native calls converted to
# pricebt units/signs; declare what your library cannot compute (end of this file).
# Runnable reference: tests/assets/toy_usd_bond.yaml (tests/toylib/bond.py).
# Proof of this template: tests/skills/test_skill_connect_example.py fills the primitives with the toy library.
schema_version: 1
asset: TODO_asset_name                 # unique; e.g. ust_bonds_<library>
description: >
  TODO: bond universe, library, curve, how bonds are marked (curve + spread, or quoted prices). Units: npv <CCY>,
  the holder-signed DIRTY PV of the flows not yet paid (paid coupons drop out and are listed by Cashflows);
  sensitivities <CCY> per bp (bp^2) of the yield (long bond delta < 0); yield and spreads in bp; Theta <CCY> per
  calendar day at a constant yield.
instrument: Bond
match: {settlement_currency: USD}      # TODO: which bonds this config serves
currency: USD
defaults:                              # no default identifier: every Bond names its own
  buy_sell: Buy
  size: 1.0e6                          # TODO: your size convention (face amount in currency here)
  settlement_currency: USD

