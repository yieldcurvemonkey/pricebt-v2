  # ============ 2. RECIPES: the contract from the primitives (keep, or map a native call instead) ============
  H = 1e-4                                   # 1bp, decimal

  def _side(buy_sell):
      s = str(getattr(buy_sell, "value", buy_sell)).strip().lower()
      if s not in ("buy", "sell"):
          raise ValueError(f"buy_sell must be Buy or Sell, got {buy_sell!r}")
      return 1.0 if s == "buy" else -1.0

  def resolve_bond(m, kw):
      """Runs ONCE on the trade date: the identifier's static data as plain values, and one signed face amount
      (buy_sell x sign(size)); pricebt never reads buy_sell or size itself."""
      ident = kw.get("identifier")
      if not ident:
          raise ValueError("a Bond needs an identifier")
      size = float(kw["size"])
      static = dict(lib_bond_static(m, ident, kw.get("identifier_type")))
      return dict(static, identifier=ident, face=abs(size) * _side(kw.get("buy_sell", "Buy")) * (1.0 if size >= 0 else -1.0))

  def pv(m, t):
      return lib_pv(m, t)

  def yield_in_bp(m, t):
      return lib_yield(m, t) * 1e4           # decimal -> bp

  def _at(t, y, d, h):
      return lib_pv_at_yield(t, y + h, d)

  def yield_delta(m, t, d, bump_bp=None, method=None):
      """IRDelta scalar and LightningDV01 (pricebt DEV-I12): dPV/dy per +1bp of yield, by yield bumps
      (bump_size read as bp). Equal to the total derivative along a curve shift: PV is a function of y alone."""
      y, h = lib_yield(m, t), float(bump_bp or 1.0) * H
      how = str(getattr(method, "value", method) or "Centered")
      if how == "Up":
          return (_at(t, y, d, h) - _at(t, y, d, 0.0)) / (h / H)
      if how == "Down":
          return (_at(t, y, d, 0.0) - _at(t, y, d, -h)) / (h / H)
      return (_at(t, y, d, h) - _at(t, y, d, -h)) / (2.0 * h / H)

  def yield_gamma(m, t, d):
      """IRGammaParallel: d2PV/dy2 per bp^2 of yield (convexity in money terms; > 0 for a long bullet bond)."""
      y = lib_yield(m, t)
      return _at(t, y, d, H) + _at(t, y, d, -H) - 2.0 * _at(t, y, d, 0.0)

  def discount_only_delta(m, t):
      return (pv(lib_shift_discount(m, H), t) - pv(lib_shift_discount(m, -H), t)) / 2.0

  def theta_one_day(m, t, d):
      """Theta (pricebt DEV-I15, bond rule): PV at the SAME yield one calendar day later + the coupons paid in
      (d, d+1] - PV(d), ccy PER DAY. Carry and pull-to-par, no curve roll."""
      d1 = d + _dt.timedelta(days=1)
      cash = sum(r["payment_amount"] for r in lib_cashflows(m, t) if r["payment_date"] <= d1)
      return lib_pv_at_yield(t, lib_yield(m, t), d1) + cash - pv(m, t)

  def years_to(end, d):
      return max((end - d).days, 0) / 365.0  # ExpiryInYears: to maturity (pricebt DEV-I17)

  def key_rate_ladder(m, trades, weights):
      """IRDelta bucketed: central 1bp bump of each curve pillar, spreads held, weighted, ccy per +1bp."""
      out = {}
      for p in lib_pillars(m):
          up, dn = lib_shift_pillar(m, p, H), lib_shift_pillar(m, p, -H)
          out[p] = sum(w * (pv(up, t) - pv(dn, t)) / 2.0 for t, w in zip(trades, weights))
      return out

  def diagonal_gamma_ladder(m, trades, weights):
      """IRGamma bucketed (pricebt DEV-I13: diagonal only), ccy per bp^2 at each pillar."""
      base = [pv(m, t) for t in trades]
      out = {}
      for p in lib_pillars(m):
          up, dn = lib_shift_pillar(m, p, H), lib_shift_pillar(m, p, -H)
          out[p] = sum(w * (pv(up, t) + pv(dn, t) - 2.0 * b) for t, w, b in zip(trades, weights, base))
      return out

market:
  expr: 'lib_market(pricebt_date)'
  key: TODO_market_key
resolve:
  expr: 'resolve_bond(market, kwargs)'
trade:
  expr: 'lib_bond(market, resolved)'
  build_on: resolve_date               # a bond's static terms do not depend on the market
functions:
  npv:             {expr: 'pv(market, trade)', unit: ccy}
  delta:           {expr: 'yield_delta(market, trade, pricebt_date, pricebt_bump_size, pricebt_finite_difference_method)', unit: ccy_per_bp}
  discount_delta:  {expr: 'discount_only_delta(market, trade)', unit: ccy_per_bp}
  gamma:           {expr: 'yield_gamma(market, trade, pricebt_date)', unit: ccy_per_bp2}
  zero_per_bp:     {expr: '0.0', unit: ccy_per_bp}    # a bullet bond has no vol exposure (R2-8); no basis/xccy leg
  zero_per_bp2:    {expr: '0.0', unit: ccy_per_bp2}
  zero_vol:        {expr: '0.0', unit: bp}            # vol levels 0.0 by convention, so mixed books work
  yield_bp:        {expr: 'yield_in_bp(market, trade)', unit: bp}
  oas_bp:          {expr: 'lib_oas(market, trade) * 1e4', unit: bp}
  par_spread_bp:   {expr: 'lib_par_spread(market, trade) * 1e4', unit: bp}
  theta_1d:        {expr: 'theta_one_day(market, trade, pricebt_date)', unit: ccy}
  expiry_in_years: {expr: 'years_to(resolved["maturity"], pricebt_date)', unit: decimal}
  annuity:         {expr: 'lib_annuity(market, trade)', unit: ccy}
  cashflows:       {expr: 'lib_cashflows(market, trade)', unit: ccy, returns: frame, scale_columns: [payment_amount]}
portfolio_functions:
  delta_ladder:
    expr: 'key_rate_ladder(market, trades, weights)'
    unit: ccy_per_bp
    returns: buckets
    labels: {mkt_type: IR, mkt_asset: TODO, mkt_class: OIS}
  gamma_ladder:
    expr: 'diagonal_gamma_ladder(market, trades, weights)'
    unit: ccy_per_bp2
    returns: buckets
    labels: {mkt_type: IR, mkt_asset: TODO, mkt_class: OIS}
  vega_cube:
    expr: '{}'
    unit: ccy_per_bp
    returns: buckets
    labels: {mkt_type: IR VOL, mkt_asset: TODO, mkt_class: SWAPTION}
attributes:
  notional_amount:  'abs(resolved["face"]) * pricebt_quantity'   # the default ScaledTransactionModel reads it
  termination_date: 'resolved["maturity"]'
size_attribute: notional_amount
risk_measures:                         # every row of the Bond contract (src/pricebt/risk/contracts.py)
  Price: npv
  IRDelta: {scalar: delta, bucketed: delta_ladder}
  IRDiscountDeltaParallel: discount_delta
  IRGammaParallel: gamma
  IRGamma: {bucketed: gamma_ladder}
  IRVega: {scalar: zero_per_bp, bucketed: vega_cube}
  IRVanna: zero_per_bp2
  IRVolga: zero_per_bp2
  IRBasis: zero_per_bp
  IRXccyDelta: zero_per_bp
  IRFwdRate: yield_bp
  IRSpotRate: yield_bp
  IRAnnualImpliedVol: zero_vol
  IRAnnualATMImpliedVol: zero_vol
  IRDailyImpliedVol: zero_vol
  Theta: theta_1d
  ExpiryInYears: expiry_in_years
  Annuity: annuity
  Cashflows: cashflows
  LightningDV01: delta
  LightningOAS: oas_bp
  ParSpread: par_spread_bp
