# Asset-config TEMPLATE: a fixed-coupon Bond (US Treasuries first) on ANY pricing / bond-analytics library, mapping
# the WHOLE strict Bond contract (src/pricebt/risk/contracts.py; docs/v2/BOND_DESIGN.md section 3): the IR base,
# the bond analytics (DEV-I20) and the repo financing contract (DEV-I21). Same layout as config-template.yaml
# (the swap): PRIMITIVES (your library and data) -> RECIPES (pricebt's contract).
#
# A Bond config must MAP every contract measure: declaring one under unsupported_measures: is a load error
# (BOND_DESIGN decision 4.1), and a literal constant is honest only where contracts.ZERO_BY_CONVENTION["Bond"]
# says the value is 0 (vol measures, IRBasis, IRXccyDelta). Conventions the recipes implement:
#   - Price is the SETTLEMENT-DATE market value: (clean + accrued at standard settlement) x face / 100,
#     holder-signed, not discounted to the pricing date; it drops a flow on the first trade date whose
#     settlement is on or after the flow's payment date, and Cashflows.payment_date is that drop date.
#   - The own rate is the YIELD TO MATURITY (DEV-I12): IRFwdRate = IRSpotRate = the yield; the IRDelta scalar and
#     IRGammaParallel are dPrice/dy and d2Price/dy2 per bp (bp^2) by yield bumps. A long bond has IRDelta < 0.
#   - Repo financing (GC or special, overnight or term, haircut) comes from YOUR library or data (lib_repo_rate)
#     and the trade's kwargs (repo_term, repo_haircut); resolve pins the trade date, its settlement, the term rate
#     and the financed principal (1 - haircut) x Price(trade date). FinancingToDate accrues simple interest in
#     REPO_BASIS from the trade's settlement to the pricing date's settlement; the engine books its change, with
#     the coupons Price drops, as cash (DEV-E22).
#   - gs Bond has `size` (no notional_amount) and `buy_sell`: resolve folds buy_sell x sign(size) into a signed
#     face amount; the attributes give the engine notional_amount (costs) and settlement_date (the gs field).
#
# Copy it to configs/assets/<asset>.yaml. It LOADS as-is; pricing it raises NotImplementedError("TODO ...") at the
# first primitive you have not filled. Fill the PRIMITIVES; keep the RECIPES or map native calls converted to
# pricebt units and signs (comment them: # vendor: X -> pricebt: Y) and check them once against the recipe.
# Runnable reference: tests/assets/toy_usd_bond.yaml (tests/toylib/bond.py).
# Proof of this template: tests/skills/test_skill_connect_example.py fills the primitives with the toy library and
# compares every contract measure with the toy config.
