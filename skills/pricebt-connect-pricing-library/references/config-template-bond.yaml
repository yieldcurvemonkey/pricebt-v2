      _todo("lib_term_repo_rate(d, identifier): your term repo source (e.g. a 1M term GC / special quote)")

  def lib_pillars(m):
      """Curve pillar labels as plain tenors, e.g. ("2Y", "5Y", "10Y", "30Y"). For CRIFIRCurve each must be a SIMM
      tenor (2W 1M 3M 6M 1Y 2Y 3Y 5Y 10Y 15Y 20Y 30Y)."""
      _todo("lib_pillars(m)")

  def lib_shift_pillar(m, pillar, h):
