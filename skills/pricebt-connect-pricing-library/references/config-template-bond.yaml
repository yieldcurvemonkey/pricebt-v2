      _todo("lib_shift_pillar(m, pillar, h)")

  # ============ 2. RECIPES: the contract from the primitives (keep, or map a native call instead) ============
  H = 1e-4                                   # 1bp, decimal
  DAY = _dt.timedelta(days=1)
  REPO_BASIS = 360.0                         # TODO: the repo day count of your market (USD and EUR: ACT/360; GBP: ACT/365)
  REPO_TERMS = ("overnight", "term")

  def _side(buy_sell):
      s = str(getattr(buy_sell, "value", buy_sell)).strip().lower()
      if s not in ("buy", "sell"):
          raise ValueError(f"buy_sell must be Buy or Sell, got {buy_sell!r}")
      return 1.0 if s == "buy" else -1.0

  def _as_date(x):
      return _dt.date.fromisoformat(x) if isinstance(x, str) else (x.date() if isinstance(x, _dt.datetime) else x)

  def repo_rate_on(r, x):
      """The repo rate charged for business day x: the term rate locked on the trade date, or the day's own."""
      return r["term_rate"] if r["repo_term"] == "term" else lib_repo_rate(x, r["identifier"])

  def resolve_bond(m, kw, d):
      """Runs ONCE on the trade date d: the identifier's static data as plain values, one signed face amount
      (buy_sell x sign(size); pricebt never reads buy_sell or size itself), the standard settlement date (a
      non-standard settlement_date kwarg is refused), and the financing terms: repo_term, the haircut, the term
      rate (lib_term_repo_rate on the trade date, for repo_term: term) and the financed principal
      (1 - haircut) x Price(trade date)."""
      ident = kw.get("identifier")
      if not ident:
          raise ValueError("a Bond needs an identifier")
      term = str(kw.get("repo_term", "overnight")).strip().lower()
      if term not in REPO_TERMS:
          raise ValueError(f"repo_term must be one of {REPO_TERMS}, got {kw.get('repo_term')!r}")
      haircut = float(kw.get("repo_haircut", 0.0))
      if not 0.0 <= haircut < 1.0:
          raise ValueError(f"repo_haircut must be a decimal in [0, 1), got {haircut!r}")
      settle0 = lib_settlement_date(d)
      if kw.get("settlement_date") is not None and _as_date(kw["settlement_date"]) != settle0:
          raise ValueError(f"non-standard settlement is not supported: settlement_date {kw['settlement_date']} != {settle0}")
      size = float(kw["size"])
      static = dict(lib_bond_static(m, ident, kw.get("identifier_type")))
      r = dict(static, identifier=ident, face=abs(size) * _side(kw.get("buy_sell", "Buy")) * (1.0 if size >= 0 else -1.0),
               trade_date=d, settlement_date=settle0, repo_term=term, haircut=haircut)
      r["term_rate"] = lib_term_repo_rate(d, ident) if term == "term" else None
      r["principal"] = (1.0 - haircut) * lib_pv(m, lib_bond(m, r))
      return r

  def pv(m, t):
      return lib_pv(m, t)

  def price_on(m, t, d):
      """Price on the pricing date d: under a CloseMarket override m is another date's market, seen from d."""
      return lib_pv(lib_at(m, d), t)

  def yield_in_bp(m, t):
      return lib_yield(m, t) * 1e4           # decimal -> bp

  def _at(m, t, d, h):
      """The value at d's standard settlement at the yield moved by h."""
      return lib_pv_at_yield(t, lib_yield(m, t) + h, lib_settlement_date(d))

  def yield_delta(m, t, d, bump_bp=None, method=None):
      """IRDelta scalar and LightningDV01 (pricebt DEV-I12): dPrice/dy per +1bp of yield, by yield bumps from the
      settlement date (bump_size read as bp)."""
      h = float(bump_bp or 1.0) * H
      how = str(getattr(method, "value", method) or "Centered")
      if how == "Up":
          return (_at(m, t, d, h) - _at(m, t, d, 0.0)) / (h / H)
      if how == "Down":
          return (_at(m, t, d, 0.0) - _at(m, t, d, -h)) / (h / H)
      return (_at(m, t, d, h) - _at(m, t, d, -h)) / (2.0 * h / H)

  def yield_gamma(m, t, d):
      """IRGammaParallel: d2Price/dy2 per bp^2 of yield (convexity in money; > 0 for a long bullet bond)."""
      return _at(m, t, d, H) + _at(m, t, d, -H) - 2.0 * _at(m, t, d, 0.0)

  def modified_duration(m, t, d):
      """ModifiedDuration: -(1/P) dP/dy in years per unit of decimal yield (the IRFwdRate yield), P the dirty
      value; 0 when dead."""
      p = _at(m, t, d, 0.0)
      return 0.0 if p == 0.0 else (_at(m, t, d, -H) - _at(m, t, d, H)) / (2.0 * H) / p

  def convexity(m, t, d):
      """Convexity: (1/P) d2P/dy2 in years^2; 0 when dead."""
      p = _at(m, t, d, 0.0)
      return 0.0 if p == 0.0 else (_at(m, t, d, H) + _at(m, t, d, -H) - 2.0 * p) / (H * H) / p

  def discount_only_delta(m, t):
      return (pv(lib_shift_discount(m, H), t) - pv(lib_shift_discount(m, -H), t)) / 2.0

  def theta_bond(m, t, d):
      """Theta (pricebt DEV-I15, Bond text): over the step to the next business day nb, at the SAME yield,
      [Price(nb) + flows Price drops in (d, nb] - Price(d)] / (nb - d).days, ccy per calendar day. One calendar
      day moves a T+1 settlement by 0 or 3 days; spreading the step makes Theta x step days exact."""
      nb = lib_next_business_day(d)
      s0, s1 = lib_settlement_date(d), lib_settlement_date(nb)
      dropped = sum(a for p, a, *_ in lib_flows(t, s0) if p <= s1)
      return (lib_pv_at_yield(t, lib_yield(m, t), s1) + dropped - pv(m, t)) / (nb - d).days

  def years_to(end, d):
      return max((end - d).days, 0) / 365.0  # ExpiryInYears: to maturity (pricebt DEV-I17)

  def drop_date(p):
      """The first trade date whose standard settlement is on or after payment date p: Price drops the flow then."""
      x = lib_next_business_day(p - 8 * DAY)
      while lib_settlement_date(x) < p:
          x = lib_next_business_day(x)
      return x

  def cashflows_frame(r, t, d, ccy):
      """Cashflows: one row per flow still in Price, holder-signed; payment_date = the trade date Price drops it."""
      rows = [(drop_date(p), a, ccy, kind, st, en, r["face"], r["coupon"]) for p, a, kind, st, en in lib_flows(t, lib_settlement_date(d))]
      return pd.DataFrame(rows, columns=["payment_date", "payment_amount", "currency", "payment_type", "accrual_start_date", "accrual_end_date", "notional", "rate"])

  def horizon(s):
      """H: the settlement date plus one calendar month, on the following business day."""
      return lib_next_business_day(s + relativedelta(months=1) - DAY)

  def repo_rate_now(r, d):
      """RepoRate: the rate in force on pricing date d (overnight: d's own rate; term: the locked rate)."""
      return repo_rate_on(r, d)

  def forward_value(m, t, r, d):
      """ForwardPrice at H (DEV-I21): Price x (1 + RepoRate tau(s, H)) - sum over flows c in (s, H] of
      C x (1 + RepoRate tau(c, H)), tau in REPO_BASIS, RepoRate held flat to H; 0 when dead."""
      s = lib_settlement_date(d)
      flows = lib_flows(t, s)
      if not flows:
          return 0.0
      h, rate = horizon(s), repo_rate_now(r, d)
      paid = sum(a * (1.0 + rate * (h - p).days / REPO_BASIS) for p, a, *_ in flows if p <= h)
      return pv(m, t) * (1.0 + rate * (h - s).days / REPO_BASIS) - paid

  def carry(m, t, r, d):
      """Carry: clean value now - clean forward value at H = (Price - AI(s)) - (ForwardPrice - AI(H)); 0 dead."""
      s = lib_settlement_date(d)
      if not lib_flows(t, s):
          return 0.0
      return (pv(m, t) - lib_accrued(t, s)) - (forward_value(m, t, r, d) - lib_accrued(t, horizon(s)))

  def roll_down(m, t, d):
      """RollDown: clean value at H on the curve rolled down (time to maturity held, spread held) - clean value
      now; 0 dead."""
      s = lib_settlement_date(d)
      if not lib_flows(t, s):
          return 0.0
      h = horizon(s)
      return (lib_pv_rolled(m, t, h) - lib_accrued(t, h)) - (pv(m, t) - lib_accrued(t, s))

  def financing_to_date(r, d):
      """FinancingToDate (DEV-I21): -(1 - haircut) x Price(trade date) x the simple interest from the trade's
      settlement to the pricing date's settlement (or maturity): each calendar day at the repo rate of the last
      business day on or before it. 0 on the trade date; a long pays (<= 0), a short receives (>= 0)."""
      # ponytail: one lib_repo_rate call per business day held, on every pricing date; cache the series if slow
      end = min(lib_settlement_date(d), r["maturity"])
      x, acc, rate = r["settlement_date"], 0.0, None
      while x < end:
          if rate is None or lib_next_business_day(x - DAY) == x:
              rate = repo_rate_on(r, x)
          acc += rate / REPO_BASIS
          x += DAY
      return -r["principal"] * acc

  def compounded_rate_bp(c, f):
      """CompoundedFixedRate: the coupon restated annually compounded, (1 + c/f)^f - 1, in bp."""
      return ((1.0 + c / f) ** f - 1.0) * 1e4

  def key_rate_ladder(m, trades, weights):
      """IRDelta bucketed: central 1bp bump of each curve pillar, spreads held, weighted, ccy per +1bp."""
      out = {}
      for p in lib_pillars(m):
          up, dn = lib_shift_pillar(m, p, H), lib_shift_pillar(m, p, -H)
          out[p] = sum(w * (pv(up, t) - pv(dn, t)) / 2.0 for t, w in zip(trades, weights))
      return out

  def diagonal_gamma_ladder(m, trades, weights):
      """IRGamma bucketed (pricebt DEV-I13: diagonal only), ccy per bp^2 at each pillar."""
      base = [pv(m, t) for t in trades]
      out = {}
      for p in lib_pillars(m):
          up, dn = lib_shift_pillar(m, p, H), lib_shift_pillar(m, p, -H)
          out[p] = sum(w * (pv(up, t) + pv(dn, t) - 2.0 * b) for t, w, b in zip(trades, weights, base))
      return out

  SIMM_TENORS = ("2w", "1m", "3m", "6m", "1y", "2y", "3y", "5y", "10y", "15y", "20y", "30y")
  CRIF_COLUMNS = ["RiskType", "Qualifier", "Bucket", "Label1", "Label2", "Amount", "AmountCurrency"]
  CRIF_BUCKET = "1"                          # TODO: the SIMM volatility group of your currency ("1": regular, e.g. USD, EUR)
  CRIF_SUBCURVE = "OIS"                      # TODO: Label2, the ISDA SIMM sub-curve of your discount curve ("OIS" -- also SOFR/ESTR --, ...)

  def crif_frame(m, t, ccy):
      """CRIFIRCurve: the trade's key-rate ladder as SIMM CRIF rows (Label1 = the pillar in lower case), so
      sum(Amount) = the IRDelta ladder's sum; empty once nothing is left."""
      rows = []
      for p, a in key_rate_ladder(m, [t], [1.0]).items():
          label = p.strip().lower()
          if label not in SIMM_TENORS:
              raise ValueError(f"pillar {p!r} is not a SIMM tenor {SIMM_TENORS}: bump at the SIMM tenors for CRIF")
          if a:
              rows.append(("Risk_IRCurve", ccy, CRIF_BUCKET, label, CRIF_SUBCURVE, a, ccy))
      return pd.DataFrame(rows, columns=CRIF_COLUMNS)

  def pnl_explain(m, m_to, trades, weights, d, ccy):
      """PnlExplain: full revaluation from market m to m_to, both seen from the pricing date d (no time passes,
      no coupon drops), weighted: IR = the curve moved with the marks held, CREDIT = the marks (the bond's spread)
      moved with the curve held, CROSSES = the rest."""
      a, b = lib_at(m, d), lib_at(m_to, d)
      base = [pv(a, t) for t in trades]
      ir = sum(w * (pv(lib_with_marks(b, a), t) - x) for t, w, x in zip(trades, weights, base))
      credit = sum(w * (pv(lib_with_marks(a, b), t) - x) for t, w, x in zip(trades, weights, base))
      total = sum(w * (pv(b, t) - x) for t, w, x in zip(trades, weights, base))
      return [{"mkt_type": "IR", "mkt_asset": ccy, "value": ir}, {"mkt_type": "CREDIT", "mkt_asset": ccy, "value": credit},
              {"mkt_type": "CROSSES", "value": total - ir - credit}]

