  expiry_in_years: {expr: 'years_to(resolved["maturity"], pricebt_date)', unit: decimal}
  annuity:         {expr: 'lib_annuity(market, trade)', unit: ccy}
  cashflows:       {expr: 'cashflows_frame(resolved, trade, pricebt_date, pricebt_currency)', unit: ccy, returns: frame, scale_columns: [payment_amount, notional]}
  forward_price:   {expr: 'forward_value(market, trade, resolved, pricebt_date)', unit: ccy}
  premium_cents:   {expr: '100.0 * price_on(market, trade, pricebt_date) / abs(resolved["face"])', unit: pct}   # Price / |face| per 100
  local_annuity:   {expr: 'lib_annuity(market, trade) / abs(resolved["face"])', unit: decimal}
  compounded_rate: {expr: 'compounded_rate_bp(resolved["coupon"], resolved["frequency"])', unit: bp}
  crif:            {expr: 'crif_frame(market, trade, pricebt_currency)', unit: ccy_per_bp, returns: frame, scale_columns: [Amount]}
  dirty_price:     {expr: '100.0 * price_on(market, trade, pricebt_date) / resolved["face"]', unit: pct}
  clean_price:     {expr: '100.0 * (price_on(market, trade, pricebt_date) - lib_accrued(trade, lib_settlement_date(pricebt_date))) / resolved["face"]', unit: pct}
  accrued:         {expr: 'lib_accrued(trade, lib_settlement_date(pricebt_date))', unit: ccy}
  mod_duration:    {expr: 'modified_duration(market, trade, pricebt_date)', unit: decimal}
  convexity:       {expr: 'convexity(market, trade, pricebt_date)', unit: decimal}
  days_to_settle:  {expr: 'float((lib_settlement_date(pricebt_date) - pricebt_date).days)', unit: number, scale_with_quantity: false}
  repo_rate:       {expr: 'repo_rate_now(resolved, pricebt_date) * 1e4', unit: bp}
  repo_haircut:    {expr: 'resolved["haircut"]', unit: decimal}
  financing:       {expr: 'financing_to_date(resolved, pricebt_date)', unit: ccy}
  carry:           {expr: 'carry(market, trade, resolved, pricebt_date)', unit: ccy}
  roll_down:       {expr: 'roll_down(market, trade, pricebt_date)', unit: ccy}
portfolio_functions:
  delta_ladder:
    expr: 'key_rate_ladder(market, trades, weights)'
    unit: ccy_per_bp
    returns: buckets
    labels: {mkt_type: IR, mkt_asset: TODO, mkt_class: OIS}
  gamma_ladder:
    expr: 'diagonal_gamma_ladder(market, trades, weights)'
    unit: ccy_per_bp2
    returns: buckets
    labels: {mkt_type: IR, mkt_asset: TODO, mkt_class: OIS}
  vega_cube:
    expr: '{}'                                          # a bullet bond has no vol cube: empty (R2-8)
    unit: ccy_per_bp
    returns: buckets
    labels: {mkt_type: IR VOL, mkt_asset: TODO, mkt_class: SWAPTION}
  pnl_explain:
    expr: 'pnl_explain(market, market_to, trades, weights, pricebt_date, pricebt_currency)'
    unit: ccy
    returns: buckets
attributes:
  notional_amount:  'abs(resolved["face"]) * pricebt_quantity'   # the default ScaledTransactionModel reads it
  termination_date: 'resolved["maturity"]'
  settlement_date:  'resolved["settlement_date"]'                # the gs Bond field: the trade date's standard settlement
size_attribute: notional_amount
risk_measures:                         # every row of the Bond contract (src/pricebt/risk/contracts.py)
  Price: npv                           # REQUIRED: the engine books cash with it
  IRDelta: {scalar: delta, bucketed: delta_ladder}
  IRDiscountDeltaParallel: discount_delta
  IRGammaParallel: gamma
  IRGamma: {bucketed: gamma_ladder}
  IRVega: {scalar: zero_per_bp, bucketed: vega_cube}
  IRVanna: zero_per_bp2
  IRVolga: zero_per_bp2
  IRBasis: zero_per_bp
  IRXccyDelta: zero_per_bp
  IRFwdRate: yield_bp
  IRSpotRate: yield_bp
  IRAnnualImpliedVol: zero_vol
  IRAnnualATMImpliedVol: zero_vol
  IRDailyImpliedVol: zero_vol
  Theta: theta_1d
  ExpiryInYears: expiry_in_years
  Annuity: annuity
  Cashflows: cashflows
  LightningDV01: delta
  LightningOAS: oas_bp
  ParSpread: par_spread_bp
  FairPremium: npv
  ForwardPrice: forward_price
  PremiumCents: premium_cents
  LocalAnnuityInCents: local_annuity
  CompoundedFixedRate: compounded_rate
  CRIFIRCurve: crif
  PnlExplain: pnl_explain
  CleanPrice: clean_price
  DirtyPrice: dirty_price
  AccruedInterest: accrued
  ModifiedDuration: mod_duration
  Convexity: convexity
  DaysToSettlement: days_to_settle
  RepoRate: repo_rate
  RepoHaircut: repo_haircut
  FinancingToDate: financing
  Carry: carry
  RollDown: roll_down
# No unsupported_measures: block -- a Bond config must map every contract measure (BOND_DESIGN decision 4.1;
# declaring one is a load error, and a gap's load error ends with a paste-ready mapping skeleton).
