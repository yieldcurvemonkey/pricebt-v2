  # ================= 1. PRIMITIVES: the only calls into YOUR library. Replace every body. =================
  # Boundary conventions: dates datetime.date; rates, yields and spreads DECIMAL; PVs in `currency:`, holder-signed,
  # for the resolved signed face amount (long > 0); shifts h DECIMAL (1bp = 1e-4).

