# Stack overlay: the rateslib adapter with the swap `dv01` bound back to the definition the RECORDED pre-refactor suite runs used (the analytic fixed-leg PV01, also for a
# swap that has started). It exists to reproduce results/ bit for bit and to bisect the one known difference (tasks/suite_reproduction.md, section 4); every other binding is
# the kit's default. The bound function lives in tools/, so the run needs it on the allow-list:
#   pricebt run configs/suite/s2_steepener_2s10s.yaml --stack configs/adapters/rateslib_swap_recorded_dv01.yaml --set "registry.allow=[support, tools.swap_suite_support]"
instruments:
  usd_sofr_ois:
    factory: "pricebt.contrib.rateslib:swap"
    bind:
      dv01: {target: {function: "tools.swap_suite_support:recorded_dv01"}, kwargs: {instrument: "@instrument", ctx: "@ctx"}}
market:
  pricers:
    primary: {wrap: "pricebt.contrib.rateslib:wrap"}
