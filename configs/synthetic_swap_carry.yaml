name: synthetic_swap_carry
doc: >
  Receive 10Y SOFR swap rolled monthly on the SYNTHETIC market (`pricebt.testing.synthetic`: Nelson-Siegel factor random walks, seeded fixings,
  weekday-only calendar named `usd_fed`); layers carry/roll/delta/convexity. The library-free reference stack is the default; the adapters are stack
  overlays: `pricebt run configs/synthetic_swap_carry.yaml --stack configs/adapters/rateslib_swap.yaml`.
backtest:
  tz: America/New_York
  date_policy: close
  grid: {start: 2024-03-01, end: 2024-08-30, freq: 1b}
  progress: {show: true, desc: SYNTH SWAP CARRY}
  attribution: {layers: [carry, roll, delta, convexity], cadence: eod}
  measures: [dv01]
market:
  mdps:
    rates: {type: "pricebt.testing.synthetic:SyntheticMarket", kwargs: {start: 2024-01-02, end: 2024-12-31, seed: 7}}
  pricers:
    primary: {mdp: rates, wrap: "pricebt.testing.refstack:wrap"}
instruments:
  usd_sofr_ois:
    asset_class: swap
    factory: "pricebt.testing.refstack:swap"
    conventions:
      calendar: usd_fed
      spot_lag_days: 2
      day_count: act360
      frequency: annual
      business_day_convention: modified_following
      payment_lag_days: 2
      compounding: daily_compounded
      stub: short_front
      end_of_month: false
      fixing_lag_days: 1
      time_accrual: lump
strategy:
  triggers:
    - type: periodic
      frequency: 1m
      actions:
        - type: add_trade
          priceables: {instrument: usd_sofr_ois, name: recv10y, terms: {side: receive, maturity: 10Y, notional: 1e7, fixed_rate: par}}
          trade_duration: 1m
outputs: {dir: ../results_new/synthetic_swap_carry}
