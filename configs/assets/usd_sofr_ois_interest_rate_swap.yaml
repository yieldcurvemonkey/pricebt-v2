schema_version: 1
asset: usd_sofr_ois_interest_rate_swap
description: >
  USD SOFR OIS swap priced by ARBS on Eris EOD curves. Reads the ARBS curve store only: no curve-store writes and no
  network for dates <= _LAST_SAFE (2026-08-20); each call creates an empty today-dated folder in ARBS's fixings cache.
  Instrument: pricebt.instrument.IRSwap (gs fields). Units: npv USD; dv01 USD per +1bp (payer > 0); rates in bp.
  Maps the whole strict IRSwap contract (docs/v2/IR_STRICT_CONTRACT.md R3-0; numbers in docs/v2/LIVE_ARBS_REPORT.md
  "Strict contract (R3)"). Single curve (USD-SOFR-1D discounts and projects), single currency, no vol: the vol
  measures, IRBasis and IRXccyDelta are 0.0 by convention (contracts.ZERO_BY_CONVENTION).
instrument: IRSwap
match: {notional_currency: USD}
currency: USD
defaults:
  pay_or_receive: Receive          # gs server default (R04 s1); coerced to PayReceive.Receive (value 'Rec')
  termination_date: 10y
  notional_currency: USD
  fixed_rate: ATM
  notional_amount: 1.0e6           # gs does not document one; pricebt makes it explicit

imports: |
  import os, sys, re, contextlib, io, warnings
  os.environ["ARBS_SUPABASE_ENABLED"] = "0"          # MUST precede ANY ARBS import (R06 s6.2): no production database
  if r"C:\Users\chris\clee\ARBS" not in sys.path:
      sys.path.insert(0, r"C:\Users\chris\clee\ARBS")
  import datetime as _dt
  import pandas as pd
  with warnings.catch_warnings():
      warnings.simplefilter("ignore")                  # rateslib LicenceNotice on import
      import rateslib as rl
  from MDP.IRSwaps.IRSwapsMDP import IRSwapsMDP
  from Query.IRSwaps.backends.rateslib.RLIRSwapCurve import RLIRSwapCurve
  import Caching.supabase_engine as _arbs_se
  if _arbs_se.SUPABASE_ENABLED:
      raise RuntimeError("ARBS was imported before ARBS_SUPABASE_ENABLED=0 took effect; restart the kernel")

code: |
  _MDP = IRSwapsMDP(source="ERIS_EOD_LIVE-RL_BASIC")   # store-backed Eris, 2020-07-01..2026-08-20 (R06 s1.3). Construct ONCE.
  # _MDP = IRSwapsMDP(source="ERIS_EOD_LIVE-RL_BASIC-NOJUMPS")   # DO NOT enable without user approval: network + overwrites
  #                                                              # curve-store partitions USD-SOFR-1D/date=<d> (R06 s1.3, s6.1)
  _CURVE = "USD-SOFR-1D"
  _LAST_SAFE = _dt.date(2026, 8, 20)   # (1) last stored RL_BASIC curve; (2) bulk_get_data reads SOFR fixings for d BEFORE the
                                       # store lookup and ignore_cache_miss does not protect it: any d whose previous US business
                                       # day is missing from ARBS's fixings cache (newest 2026-09-04) triggers a NY Fed/FRED download
                                       # and rewrites the fixings cache. Raise only after a deliberate refresh approved by the user.
  _ATM = re.compile(r"^\s*(atm|a)\s*(?:([+-])\s*(\d+(?:\.\d+)?))?\s*$", re.I)   # 'ATM', 'ATM+25', 'a-100' (bp)

  def load_market(d):
      if d >= _dt.date.today() or d > _LAST_SAFE:
          return None                  # today -> 'live' (network); after _LAST_SAFE -> fixings download (network + writes)
      if d.weekday() >= 5:
          return None
      try:
          got = _MDP.bulk_get_data(dict(curve_name=_CURVE, timestamps=[d], ignore_cache_miss=True))   # fresh dict (ARBS pops keys)
      except ValueError as e:
          if "resolved to an empty collection" in str(e):
              return None              # US GovernmentBond holiday (QuantLib calendar): ARBS drops the date, then raises
          raise
      m = got.get(d)
      if m is None:
          return None                  # store hole / sanity-quarantined day
      if m.reference_date().date() != d:
          raise ValueError(f"served reference date {m.reference_date().date()} for {d}")   # validate the serve (R06 s1.6)
      return m

  def _tenor(x):
      return isinstance(x, str) and re.fullmatch(r"\d+[dwmyDWMY]", x.strip()) is not None

  def _effective(m, eff):
      if eff is None or (isinstance(eff, str) and eff.strip().lower() in ("spot", "0b")):
          return m.spot_date()                                   # reference + 2b (R06 s3.2)
      if isinstance(eff, str):
          return m.calendar_advance(m.spot_date(), eff)          # forward start counted FROM SPOT (not build_irswap(fwd=))
      return pd.Timestamp(eff).to_pydatetime()

  def _sign(por):
      s = str(getattr(por, "value", por)).strip().lower()        # pricebt enum (value 'Rec'), or a raw string
      if s == "pay": return 1.0
      if s in ("rec", "receive", "receiver"): return -1.0
      raise ValueError(f"pay_or_receive must be Pay or Receive, got {por!r}")

  def resolve_swap(m, kw):
      eff = _effective(m, kw.get("effective_date"))
      term = kw["termination_date"]
      notional = float(kw["notional_amount"]) * _sign(kw["pay_or_receive"])   # '100k'-style strings are rejected by float()
      if _tenor(term):
          probe = m.build_irswap(effective_date=eff, tenor=term.upper(), notional=notional)   # struck at par (sentinel)
      else:
          probe = m.build_irswap(effective_date=eff, maturity_date=pd.Timestamp(term).to_pydatetime(), notional=notional)
      fr = kw.get("fixed_rate", "ATM")
      mm = _ATM.match(fr) if isinstance(fr, str) else None
      if mm:
          spread_bp = float(mm.group(3) or 0.0) * (-1.0 if mm.group(2) == "-" else 1.0)
          k = float(m.fair_rate(probe)) + spread_bp / 1e4          # decimal
      elif isinstance(fr, str):
          raise ValueError(f"unsupported fixed_rate {fr!r} (use 'ATM', 'ATM+x', 'a-x' in bp, or a decimal)")
      else:
          k = float(fr)                                              # decimal, gs convention (0.0325 = 3.25%)
      if k == 0.0:
          raise ValueError("a 0.0 strike collides with the ARBS par sentinel (R06 s3.3)")
      return {
          "effective_date": m.effective_date(probe).date(),
          "termination_date": m.maturity_date(probe).date(),
          "fixed_rate": k,                                           # decimal
          "notional": notional,                                      # signed, + = payer
      }

  def build_swap(m, r):
      return m.build_irswap(effective_date=pd.Timestamp(r["effective_date"]).to_pydatetime(),
                            maturity_date=pd.Timestamp(r["termination_date"]).to_pydatetime(),
                            fixed_rate=r["fixed_rate"], notional=r["notional"])

  def alive(m, t):                          # rate/risk functions: the swap still has accrual periods ahead
      return m.maturity_date(t).date() > m.reference_date().date()

  def unsettled(m, t):                      # npv only: the final coupon pays at maturity + PaymentLag 2b (R06 s2), and ARBS
      # npv keeps a coupon ON its payment date (dropping it the day after, verified live), so '>=': with '>' Price
      # went to 0 a day before Cashflows/cash_paid_to_date paid the final coupon (live: a -4,489.71 / +4,489.71
      # residual pair on 2025-01-08/09 for a 1y payer), the same drop day as every earlier coupon now.
      return pd.Timestamp(m.calendar_advance(m.maturity_date(t), "2b")).date() >= m.reference_date().date()

  def remark(m, t):                        # the same swap rebuilt on market m (m's fixings); memo per market (R06 s3.4)
      memo = m.__dict__.setdefault("_pricebt_remark", {})
      hit = memo.get(id(t))
      if hit is not None and hit[0] is t:
          return hit[1]
      r = m.build_irswap(effective_date=m.effective_date(t), maturity_date=m.maturity_date(t),
                         fixed_rate=m.fixed_rate(t), notional=m.notional(t))
      memo[id(t)] = (t, r)
      return r

  def _carry_ok(m, t, h):                  # mirrors ARBS's own raise conditions (_carry_roll.py:167-183)
      start = pd.Timestamp(m.calendar_advance(m.spot_date(), h))
      return pd.Timestamp(m.effective_date(t)) >= start or pd.Timestamp(m.maturity_date(t)) > start

  def _roll_ok(m, t, h):                   # _carry_roll.py:140-162
      spot = pd.Timestamp(m.spot_date())
      aged_eff = max(pd.Timestamp(m.calendar_advance(m.effective_date(t), "-" + h)), spot)
      return pd.Timestamp(m.calendar_advance(m.maturity_date(t), "-" + h)) > aged_eff

  def _risk_model(m, tenors):              # par-swap risk curve + Solver, memoised per (market, tenors) (R06 s4 option B)
      memo = m.__dict__.setdefault("_pricebt_risk", {})
      if tenors in memo:
          return memo[tenors]
      dense, spot, ref = m.handle(), m.spot_date(), m.reference_date()
      nodes, pars = {ref: 1.0}, []
      for b in tenors:
          p = m.build_irswap(effective_date=spot, tenor=b, notional=1_000_000)
          pars.append(float(m.fair_rate(p)))
          mat = m.maturity_date(p)
          nodes[mat] = float(dense[mat])
      risk = rl.Curve(nodes=dict(sorted(nodes.items())), convention=dense.meta.convention,
                      calendar=dense.meta.calendar, interpolation="log_linear", id=f"{m.id()}-RISK")
      meta = dict(m.meta()); meta["id"] = risk.id
      rh = RLIRSwapCurve(rl_curve_id=risk.id, rl_curve_handle=risk, fixings=m.index(), meta_data=meta)
      insts = [rh.build_irswap(effective_date=spot, tenor=b, fixed_rate=k, notional=1_000_000) for b, k in zip(tenors, pars)]
      with contextlib.redirect_stdout(io.StringIO()):
          sv = rl.Solver(curves=[risk], instruments=insts, s=[k * 100.0 for k in pars],
                         instrument_labels=list(tenors), id=risk.id, func_tol=1e-8, conv_tol=1e-10)
      if sv.result["status"] != "SUCCESS":
          raise RuntimeError(f"risk curve calibration failed: {sv.result}")
      memo[tenors] = (rh, sv)
      return memo[tenors]

  # ------------------------------------------------------------------- P&L explain (PNL_EXPLAIN_PLAN.md T2)
  def _explain_memo(m):
      return m.__dict__.setdefault("_pricebt_explain", {})

  def _bump_curves(m):                # gamma (2.1): +/-1bp PARALLEL shift; same node dates as m, so no
      memo = _explain_memo(m)         # fixings gap (unlike translate below) -- reuse m's own fixings as-is.
      if "bump" not in memo:
          up, down = m.handle().shift(1.0), m.handle().shift(-1.0)
          meta = dict(m.meta())
          meta_up = dict(meta); meta_up["id"] = up.id
          meta_down = dict(meta); meta_down["id"] = down.id
          memo["bump"] = (
              RLIRSwapCurve(rl_curve_id=up.id, rl_curve_handle=up, fixings=m.index(), meta_data=meta_up),
              RLIRSwapCurve(rl_curve_id=down.id, rl_curve_handle=down, fixings=m.index(), meta_data=meta_down),
          )
      return memo["bump"]

  def _translated_curve(m):           # theta (2.2): curve translated 1 CALENDAR day, forwards held fixed.
      memo = _explain_memo(m)
      if "trans" not in memo:
          ref = m.reference_date()
          ref_d = ref.date() if hasattr(ref, "date") else ref
          new_start = _dt.datetime(ref_d.year, ref_d.month, ref_d.day) + _dt.timedelta(days=1)
          translated = m.handle().translate(new_start)
          # PITFALL (plan 3.5): the translated curve starts at new_start, so rateslib cannot forecast
          # [ref, new_start) off it (Curve.__getitem__ returns DF=0 for a date before its own initial
          # node) -- and m's own fixings are filtered strictly < ref (ARBS's _asof_fixings), so that one
          # day is missing from BOTH sources at once. Append the ORIGINAL (untranslated) curve's own
          # overnight forward for exactly that window -- constant-forwards, matching theta's own
          # convention -- to a COPY of the fixings; never write to m's own series or ARBS's cache.
          # Verified live on a seasoned trade (docs/v2/LIVE_ARBS_REPORT.md "P&L explain"): unpatched
          # theta was -3.7e8 (a missing-fixing division-by-zero symptom inside rateslib); patched, 2.7e3.
          fwd_pct = m.handle().rate(ref, new_start)   # percent, matching the fixings series' own units
          fixings = m.index().copy()
          fixings.loc[pd.Timestamp(ref_d)] = float(fwd_pct)
          fixings = fixings.sort_index()
          meta = dict(m.meta()); meta["id"] = translated.id
          memo["trans"] = RLIRSwapCurve(rl_curve_id=translated.id, rl_curve_handle=translated, fixings=fixings, meta_data=meta)
      return memo["trans"]

  def _cashflow_sum(m, t, predicate):  # sum of holder-signed Cashflow (both legs) whose Payment date
      cf = remark(m, t).cashflows(curves=m.handle())   # matches `predicate` (research/06 s251, verified live:
      pay = cf["Payment"].apply(lambda p: p.date() if hasattr(p, "date") else p)   # columns include
      return float(cf.loc[pay.apply(predicate), "Cashflow"].sum())                 # Payment/Cashflow;
      # a payer's fixed leg Cashflow < 0, float leg > 0 -- net is payer-positive when float > fixed, 2.4)

  def _price(m, t):                    # = the npv function (Price): holder-signed PV, 0 once the final coupon has dropped
      return m.npv(t) if unsettled(m, t) else 0.0

  def _ref_d(m):
      ref = m.reference_date()
      return ref.date() if hasattr(ref, "date") else ref

  def _final_period_par(m, t):         # dead-trade IRFwdRate (R2-7; LIVE_ARBS_REPORT.md "Strict contract (R3)"):
      cf = remark(m, t).cashflows(curves=m.handle())   # the par of the FINAL accrual period from its own two
      last = cf[cf["Payment"] == cf["Payment"].max()]  # flows, K * float / -fixed. Both legs pay on one date, so
      kind = last["Type"].astype(str)                  # the DF cancels: it equals fair_rate on every dead-but-
      fl = float(last.loc[kind.str.contains("Float"), "Cashflow"].sum())   # unsettled date (verified live) and
      fx = float(last.loc[kind.str.contains("Fixed"), "Cashflow"].sum())   # stays finite once the coupon has
      return m.fixed_rate(t) * 1e4 * (-fl / fx)                            # paid (fair_rate then divides by 0)

  def par_bp(m, t):                    # IRFwdRate, bp: the remaining swap's par; continuous past maturity (R2-7)
      return m.fair_rate(remark(m, t)) * 1e4 if alive(m, t) else _final_period_par(m, t)

  def gamma(m, t):                     # IRGammaParallel: chain-rule d2 npv / d par2 per bp2 of this trade's OWN par
      if not alive(m, t):              # (contracts.py IRGammaParallel; MERGE_NOTES_pnl_explain.md section 4). The
          return 0.0                   # bare (n+ + n- - 2n0)/((p+ - p-)/2)^2 drops the par's own convexity: ~10% low
      rh_up, rh_down = _bump_curves(m) # at 10y ATM (live: -0.7365 vs -0.8168 on 2024-05-20). NEVER d(dv01)/dpar.
      t_up, t_down = remark(rh_up, t), remark(rh_down, t)   # fresh fixings-kwargs per wrapper (fair_rate
      npv_up, npv_down, npv_mid = rh_up.npv(t_up), rh_down.npv(t_down), m.npv(t)   # does not rebuild)
      par_up, par_down = rh_up.fair_rate(t_up) * 1e4, rh_down.fair_rate(t_down) * 1e4
      par_mid = m.fair_rate(remark(m, t)) * 1e4
      dpar = par_up - par_down
      return (npv_up + npv_down - 2.0 * npv_mid - (npv_up - npv_down) / dpar * (par_up + par_down - 2.0 * par_mid)) / (dpar / 2.0) ** 2

  def theta_1d(m, t):                  # Theta (DEV-I15): ccy per CALENDAR DAY, curve translated one day (forwards fixed),
      if not alive(m, t):              # own par held fixed, plus the flows npv drops in (t, t+1d].
          return 0.0
      rh = _translated_curve(m)
      tt = remark(rh, t)
      ref_d = _ref_d(m)
      # npv keeps a coupon while Payment >= reference_date and drops it the day AFTER Payment (verified live), so
      # the flows npv drops in (t, t+1d] are exactly those with Payment == t: still in npv(t), already out of the
      # translated npv. Add them back so Theta is time decay, never the cash transfer Cashflows reports.
      coupon_today = _cashflow_sum(m, t, lambda d: d == ref_d)
      # Own par held fixed: on a normal day the translated par equals today's to ~1e-6bp (A-THETA), so this term
      # is ~0. On a coupon day the paid period leaves the remaining swap and its par jumps (live: -14.2bp on
      # 2025-01-08 for a 10y payer); that jump is time, not market, so take it out at the translated pv01
      # (npv_T - pv01_T * (par_T - par_0) = pv01_T * (par_0 - K), the identity A-IDENT checks).
      # That jump is ONE-OFF, but the engine books PNL_theta = Theta x step calendar days, so spread it over the
      # calendar days to the next business day (DEV-I15): a Friday coupon step (3 days) then counts it once, not
      # 3x (live: residual -23,359 -> +1,365 on 2024-03-15 -> 03-18, coupon 13,714.56). A coarser grid than
      # business days (or a grid holiday the curve calendar keeps open) leaves the excess in the residual.
      par_shift = rh.fair_rate(tt) * 1e4 - m.fair_rate(remark(m, t)) * 1e4
      n = (pd.Timestamp(m.calendar_advance(m.reference_date(), "1b")).date() - ref_d).days
      return rh.npv(tt) - rh.pv01(tt) * par_shift / n + coupon_today - m.npv(t)

  def theta(m, t):                     # PNL_EXPLAIN_PLAN 2.2 IRTheta: ccy per YEAR = 365 x Theta (one definition)
      return 365.0 * theta_1d(m, t)

  def discount_delta(m, t):            # IRDiscountDeltaParallel: +-1bp on the DISCOUNT curve only, the projection
      if not alive(m, t):              # curve (forwards) held: rateslib curves=[forecast, discount] (verified live:
          return 0.0                   # [h, h+1bp] moves npv by the discounting part only)
      up, down = (w.handle() for w in _bump_curves(m))
      h, rt = m.handle(), remark(m, t)
      return (float(rt.npv(curves=[h, up])) - float(rt.npv(curves=[h, down]))) / 2.0

  def spot_rate(m, t):                 # IRSpotRate, bp: par of the spot-starting swap with this trade's termination date
      mat, spot = pd.Timestamp(m.maturity_date(t)), m.spot_date()
      if mat <= pd.Timestamp(spot):            # nothing left to start from spot: the zero-length limit of that swap,
          return float(m.handle().rate(spot, m.calendar_advance(spot, "1b"))) * 100.0   # the overnight forward at spot
      return m.fair_rate(m.build_irswap(effective_date=m.spot_date(), maturity_date=mat.to_pydatetime(), notional=1_000_000)) * 1e4

  def expiry_in_years(m, t):           # ExpiryInYears (DEV-I17): calendar days to the termination date / 365
      return max((m.maturity_date(t).date() - _ref_d(m)).days, 0) / 365.0

  def annuity(m, t):                   # Annuity: 1e4 x the fixed-leg pv01, holder-signed (pv01 is payer > 0)
      return 1e4 * m.pv01(t) if alive(m, t) else 0.0

  def par_spread(m, t):                # ParSpread, bp: rateslib's float-leg spread making npv 0 (direction-free);
      if alive(m, t):                  # = K - par for these matching annual legs. Dead: K - the continued par.
          return float(remark(m, t).spread(curves=m.handle()))
      return m.fixed_rate(t) * 1e4 - par_bp(m, t)

  def fair_premium(m, t):              # FairPremium (DEV-I19): Price / DF(spot); USD spot = reference + 2b
      return _price(m, t) / float(m.handle()[m.spot_date()])

  def forward_price(m, t):             # ForwardPrice (DEV-I19): Price / DF(termination); on or after it: Price
      mat = m.maturity_date(t)
      return _price(m, t) if mat.date() <= _ref_d(m) else _price(m, t) / float(m.handle()[mat.to_pydatetime()])

  def compounded_fixed_rate(m, t):     # CompoundedFixedRate, bp: (1 + K/f)^f - 1, f = fixed-leg periods a year
      f = float(t.kwargs.leg1["schedule"].periods_per_annum)   # usd_irs: annual, so K itself
      return ((1.0 + m.fixed_rate(t) / f) ** f - 1.0) * 1e4

  _CF_COLUMNS = ["payment_date", "payment_amount", "currency", "payment_type"]

  def cashflows(m, t):                 # Cashflows (R2-6): the flows npv still holds, holder-signed, one row each.
      cf = remark(m, t).cashflows(curves=m.handle())
      ref_d = _ref_d(m)
      rows = []
      for p, a, k in zip(cf["Payment"], cf["Cashflow"], cf["Type"]):
          p = p.date() if hasattr(p, "date") else p
          if p >= ref_d:               # still inside npv(t) (npv drops a flow the day after Payment)
              # payment_date = the date Price DROPS the flow = Payment + 1 calendar day, so a step (t0, t1]
              # counts it exactly when npv loses it (and when cash_paid_to_date's `Payment < ref` gains it).
              rows.append((p + _dt.timedelta(days=1), float(a), "USD", str(k).replace("Period", "")))
      return pd.DataFrame(rows, columns=_CF_COLUMNS)

  _CRIF_COLUMNS = ["RiskType", "Qualifier", "Bucket", "Label1", "Label2", "Amount", "AmountCurrency"]

  def crif_ir_curve(m, t):             # CRIFIRCurve: one SIMM row per ladder pillar from this trade's delta ladder
      if not alive(m, t):
          return pd.DataFrame(columns=_CRIF_COLUMNS)
      ladder = delta_ladder(m, [t], [1.0], _PILLARS)
      return pd.DataFrame([("Risk_IRCurve", "USD", "1", b.lower(), "OIS", v, "USD") for b, v in ladder.items()], columns=_CRIF_COLUMNS)

  def pnl_explain(m, m_to, trades, weights):   # PnlExplain (CloseMarket): full revaluation, IR = sum w (npv(to) - npv)
      # An ARBS market carries its own valuation date (no re-anchoring as the toys do), so the IR row also holds
      # the time between the two markets' dates (carry, and a coupon npv drops in between).
      return [{"mkt_type": "IR", "mkt_asset": "USD", "value": sum(w * (_price(m_to, t) - _price(m, t)) for t, w in zip(trades, weights))}]

  def year_fraction(m):                # 2.3: intensive time coordinate, no trade dependency at all
      ref = m.reference_date()
      ref_d = ref.date() if hasattr(ref, "date") else ref
      return (ref_d - _dt.date(2000, 1, 1)).days / 365.0

  def cash_paid_to_date(m, t):         # 2.4/3.5: holder-signed, cumulative to the market's reference date
      ref = m.reference_date()         # strict '<' matches npv's own drop point exactly (verified live):
      ref_d = ref.date() if hasattr(ref, "date") else ref   # a coupon leaves npv (Payment < ref) on the
      return _cashflow_sum(m, t, lambda d: d < ref_d)        # same date it first counts as paid here --
      # never a double count (both) or a miss (neither) on the payment step itself.

  _PILLARS = ("2Y", "5Y", "10Y", "30Y")

  def _on_risk(m, trades, weights, tenors):   # (solver, live trades rebuilt on the risk curve, weights applied), or None
      live = [(t, w) for t, w in zip(trades, weights) if alive(m, t) and w != 0.0]
      if not live:
          return None
      rh, sv = _risk_model(m, tenors)
      return sv, [rh.build_irswap(effective_date=m.effective_date(t), maturity_date=m.maturity_date(t),
                                  fixed_rate=m.fixed_rate(t), notional=m.notional(t) * w) for t, w in live]

  def delta_ladder(m, trades, weights, tenors):
      tenors = tuple(tenors)
      got = _on_risk(m, trades, weights, tenors)
      if got is None:
          return {b: 0.0 for b in tenors}
      sv, rebuilt = got
      d = rl.Portfolio(rebuilt).delta(solver=sv)
      blk = d.xs("instruments", level=0) if "instruments" in set(d.index.get_level_values(0)) else d
      s = blk.iloc[:, 0].astype(float); s.index = s.index.get_level_values(-1)
      return {b: float(s.get(b, 0.0)) + 0.0 for b in tenors}   # USD per +1bp of each pillar par rate, payer > 0

  def gamma_ladder(m, trades, weights, tenors):   # IRGamma (DEV-I13): the DIAGONAL of rateslib's solver cross-gamma,
      tenors = tuple(tenors)                      # USD per bp2 of each pillar par rate (the full Hessian, not half:
      got = _on_risk(m, trades, weights, tenors)  # its sum over every cell equals the chain-rule IRGammaParallel,
      if got is None:                             # verified live); the cross terms are dropped, so the diagonal
          return {b: 0.0 for b in tenors}         # sum differs from IRGammaParallel (recorded in the report)
      sv, rebuilt = got
      g = rl.Portfolio(rebuilt).gamma(solver=sv)
      rows, cols = list(g.index.get_level_values(-1)), list(g.columns.get_level_values(-1))
      cells = g.to_numpy(dtype=float)
      return {b: float(cells[rows.index(b), cols.index(b)]) + 0.0 if b in rows and b in cols else 0.0 for b in tenors}

market:
  expr: 'load_market(pricebt_date)'        # -> RLIRSwapCurve, or None (weekend, US holiday, store hole, beyond _LAST_SAFE)
  key: usd_sofr_eris_rlbasic
resolve:
  expr: 'resolve_swap(market, kwargs)'
trade:
  expr: 'build_swap(market, resolved)'
  build_on: resolve_date                   # npv/pv01 are safe on later markets; other functions use remark() (R06 s3.4)
functions:
  npv:        {expr: '0.0 if not unsettled(market, trade) else market.npv(trade)', unit: ccy}
  dv01:       {expr: '0.0 if not alive(market, trade) else market.pv01(trade)', unit: ccy_per_bp}   # annuity pv01: the own-rate delta exactly only at the money (R2-1); safe as-is (R06 s3.4)
  par_rate:   {expr: 'par_bp(market, trade)', unit: bp}   # dead: the final period's par, continuous with the last live value (R2-7; LIVE_ARBS_REPORT.md)
  fixed_rate: {expr: 'market.fixed_rate(trade) * 1e4', unit: bp}
  carry_1m:   {expr: 'float("nan") if not (alive(market, trade) and _carry_ok(market, trade, "1m")) else market.carry_bps_running(remark(market, trade), "1m")', unit: bp}
  roll_1m:    {expr: 'float("nan") if not (alive(market, trade) and _roll_ok(market, trade, "1m")) else market.roll_bps_running(remark(market, trade), "1m")', unit: bp}
  gamma:             {expr: 'gamma(market, trade)', unit: ccy_per_bp2}
  theta:             {expr: 'theta(market, trade)', unit: ccy}                    # ccy per YEAR (IRTheta), = 365 x theta_1d
  theta_1d:          {expr: 'theta_1d(market, trade)', unit: ccy}                 # ccy per calendar DAY (Theta)
  year_fraction:     {expr: 'year_fraction(market)', unit: decimal}               # intensive time coordinate
  cash_paid_to_date: {expr: 'cash_paid_to_date(market, trade)', unit: ccy}
  discount_delta:    {expr: 'discount_delta(market, trade)', unit: ccy_per_bp}
  zero_per_bp:       {expr: '0.0', unit: ccy_per_bp}    # IRVega/IRBasis/IRXccyDelta: no vol, one curve, one currency (ZERO_BY_CONVENTION)
  zero_per_bp2:      {expr: '0.0', unit: ccy_per_bp2}   # IRVanna/IRVolga: no vol exposure (R2-8)
  zero_vol:          {expr: '0.0', unit: bp}            # vol levels: 0.0 by convention on a swap (R2-8)
  spot_rate:         {expr: 'spot_rate(market, trade)', unit: bp}
  expiry_in_years:   {expr: 'expiry_in_years(market, trade)', unit: decimal}
  annuity:           {expr: 'annuity(market, trade)', unit: ccy}
  cashflows:         {expr: 'cashflows(market, trade)', unit: ccy, returns: frame, scale_columns: [payment_amount]}
  par_spread:        {expr: 'par_spread(market, trade)', unit: bp}
  fair_premium:      {expr: 'fair_premium(market, trade)', unit: ccy}
  forward_price:     {expr: 'forward_price(market, trade)', unit: ccy}
  premium_cents:     {expr: '_price(market, trade) / abs(market.notional(trade)) * 1e4', unit: bp}   # intensive (bp)
  local_annuity_in_cents: {expr: 'annuity(market, trade) / abs(market.notional(trade))', unit: decimal}   # intensive
  compounded_fixed_rate:  {expr: 'compounded_fixed_rate(market, trade)', unit: bp}
  crif_ir_curve:     {expr: 'crif_ir_curve(market, trade)', unit: ccy, returns: frame, scale_columns: [Amount]}
portfolio_functions:
  delta_ladder:
    expr: 'delta_ladder(market, trades, weights, _PILLARS)'
    unit: ccy_per_bp
    returns: buckets
    labels: {mkt_type: IR, mkt_asset: USD-SOFR-1D, mkt_class: OIS}
  gamma_ladder:
    expr: 'gamma_ladder(market, trades, weights, _PILLARS)'
    unit: ccy_per_bp2
    returns: buckets
    labels: {mkt_type: IR, mkt_asset: USD-SOFR-1D, mkt_class: OIS}
  vega_cube:
    expr: '{}'                          # no vol exposure: an empty cube (R2-8)
    unit: ccy_per_bp
    returns: buckets
    labels: {mkt_type: IR VOL, mkt_asset: USD-SOFR-1D, mkt_class: SWAPTION}
  pnl_explain:                          # PnlExplain(CloseMarket(date=...)): receives market_to (IR_RISK_DESIGN section 8)
    expr: 'pnl_explain(market, market_to, trades, weights)'
    unit: ccy
    returns: buckets
attributes:
  effective_date:   'resolved["effective_date"]'
  termination_date: 'resolved["termination_date"]'
  notional_amount:  'abs(resolved["notional"]) * pricebt_quantity'   # signed by quantity: rebalance netting (s9.4)
size_attribute: notional_amount
risk_measures:   # the whole strict IRSwap contract (R3-0); IRTheta, YearFraction, CashPaidToDate: swap_pnl's custom names
  Price: npv
  IRDelta: {scalar: dv01, bucketed: delta_ladder}      # IRDeltaParallel / IRDeltaLocalCcy fall back here (s8.1 rule 3)
  IRDiscountDeltaParallel: discount_delta
  IRGammaParallel: gamma
  IRGamma: {bucketed: gamma_ladder}
  IRVega: {scalar: zero_per_bp, bucketed: vega_cube}
  IRVanna: zero_per_bp2
  IRVolga: zero_per_bp2
  IRBasis: zero_per_bp
  IRXccyDelta: zero_per_bp
  IRFwdRate: par_rate
  IRSpotRate: spot_rate
  IRAnnualImpliedVol: zero_vol
  IRAnnualATMImpliedVol: zero_vol
  IRDailyImpliedVol: zero_vol
  Theta: theta_1d
  ExpiryInYears: expiry_in_years
  Annuity: annuity
  Cashflows: cashflows
  ParSpread: par_spread
  FairPremium: fair_premium
  ForwardPrice: forward_price
  PremiumCents: premium_cents
  LocalAnnuityInCents: local_annuity_in_cents
  CompoundedFixedRate: compounded_fixed_rate
  CRIFIRCurve: crif_ir_curve
  PnlExplain: pnl_explain
  IRTheta: theta
  YearFraction: year_fraction
  CashPaidToDate: cash_paid_to_date
