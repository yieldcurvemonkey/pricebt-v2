doc: >
  Shared base of the SWAP suite configs (EOD: _swap_base_eod.yaml; minute: s08*). Not a runnable strategy on its own.
  ONE instrument spec, `usd_sofr_ois`: side, maturity, notional and fixed rate are TERMS supplied by
  each action. Sign convention: side pay = pay fixed (+dv01, profits when rates rise); receive = receive fixed (-dv01). dv01 = ccy per +1bp of the swap's
  own par rate, per unit as built with its notional. P&L is holder-positive.
  The `conventions` block is written out once and shared by every stack (spec T5, X1): `calendar` NAMES the calendar the market snapshot carries
  (`usd_fed`, served by the test-support curve store). The base names the dependency-free reference stack as its default library; the pricing libraries
  are STACK OVERLAYS that set only instruments.usd_sofr_ois.factory / .bind and market.pricers.primary.wrap:
  `pricebt run <config> --stack configs/adapters/rateslib_swap.yaml` (also quantlib_swap.yaml, refstack_swap.yaml).
  Market data comes from `support.curves:CurveStore` (tests/support, test code): run from the project root with the root, `src` and `tests` on the
  python path (pytest.ini sets them for the tests). backtest.calendar is a copy of the calendar the store serves as `usd_fed`
  (tests/test_suite_swaps.py asserts the two are equal when the fixtures are present).
registry: {allow: [support]}
backtest:
  tz: America/New_York
  calendar: calendars/usd_fed.json
  date_policy: close
  progress: {show: true}
  attribution: {layers: [carry, roll, delta, convexity]}
  measures: [dv01]
instruments:
  usd_sofr_ois:
    asset_class: swap
    factory: "pricebt.testing.refstack:swap"
    conventions:
      calendar: usd_fed
      spot_lag_days: 2
      day_count: act360
      frequency: annual
      business_day_convention: modified_following
      payment_lag_days: 2
      compounding: daily_compounded
      stub: short_front
      end_of_month: false
      fixing_lag_days: 1
      time_accrual: lump
