extends: _swap_base_eod.yaml
name: s12_always_flat
doc: >
  S12 control. Always flat on REAL curves, 2022-01-03..2025-12-31: a level-triggered mkt trigger on a constant 0 signal that can never
  cross 1.0, plus a monthly add_scaled_trade of size 0 (exercises trigger -> action -> sizing every month). Equity must be EXACTLY 0.0 on
  every row; trades, positions and layers empty. No cash accrual (so exact zero is the right answer).
backtest:
  progress: {desc: S12 ALWAYS FLAT}
signals:
  zero: {type: constant, value: 0.0}
strategy:
  triggers:
    - type: mkt
      data_source: zero
      trigger_level: 1.0
      direction: ABOVE
      actions:
        - type: add_trade
          name: never
          priceables: {instrument: usd_sofr_ois, name: recv10y, terms: {side: receive, maturity: 10Y, notional: 1e7, fixed_rate: par}}
          trade_duration: null
    - type: periodic
      frequency: 1m
      actions:
        - type: add_scaled_trade
          name: zero_size
          priceables: {instrument: usd_sofr_ois, name: recv10y, terms: {side: receive, maturity: 10Y, notional: 1e7, fixed_rate: par}}
          trade_duration: "next schedule"
          scaling_type: size
          scaling_level: 0
outputs: {dir: ../../results_new/s12_always_flat}
