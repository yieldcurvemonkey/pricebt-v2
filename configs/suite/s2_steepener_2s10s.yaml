extends: _swap_base_eod.yaml
name: s2_steepener_2s10s
doc: >
  S2. DV01-neutral 2s10s STEEPENER on REAL EOD SOFR curves, 2022-01-03..2025-12-31: receive 2Y (dv01 -10,000/bp) and pay 10Y
  (dv01 +10,000/bp), sized at the same pricer with add_scaled_trade(risk_measure=dv01), re-struck at par every month.
  P&L ~ +10,000 * d(r10 - r2) in bp: it profits when the 2s10s slope RISES (steepens). Re-neutralised by a rebalance_trigger on the
  book's net dv01 checked every 5 grid points (weekly) with a band of +/-100/bp (1% of leg dv01; a 250 band never fired in 2022-2025
  under the recorded analytic dv01 of a started swap, tasks/suite_reproduction.md section 3; the s2_band_50/100/250 variants of tools/run_suite_swaps.py sweep it): the rebalance adds a fresh 2Y receiver
  sized to bring net dv01 to 0; its duration is inherited from the live 2Y leg, so every top-up expires with the monthly roll.
  Cost: 0.1 ccy per ccy of dv01 per side on every leg and top-up. One instrument spec; the legs differ only in their terms.
backtest:
  progress: {desc: S2 STEEPENER 2S10S}
strategy:
  triggers:
    - type: periodic
      frequency: 1m
      actions:
        - type: add_scaled_trade
          name: steep_pay10y
          priceables: {instrument: usd_sofr_ois, name: pay10y, terms: {side: pay, maturity: 10Y, notional: 1e7, fixed_rate: par}}
          trade_duration: "next schedule"
          tags: [core, leg10y]
          scaling_type: risk_measure
          scaling_risk: dv01
          scaling_level: 10000
          transaction_cost: {type: scaled, scaling_type: "measure:dv01", scaling_level: 0.1}
        - type: add_scaled_trade
          name: steep_recv2y
          priceables: {instrument: usd_sofr_ois, name: recv2y, terms: {side: receive, maturity: 2Y, notional: 1e7, fixed_rate: par}}
          trade_duration: "next schedule"
          tags: [core, leg2y]
          scaling_type: risk_measure
          scaling_risk: dv01
          scaling_level: -10000
          transaction_cost: {type: scaled, scaling_type: "measure:dv01", scaling_level: 0.1}
    - type: rebalance_trigger
      measure: dv01
      band: 100
      scope: portfolio
      check_every: 5
      actions:
        - type: rebalance
          name: reneutral_2y
          priceable: {instrument: usd_sofr_ois, name: recv2y, terms: {side: receive, maturity: 2Y, notional: 1e7, fixed_rate: par}}
          measure: dv01
          scope: portfolio
          tags: [rebalance, leg2y]
          transaction_cost: {type: scaled, scaling_type: "measure:dv01", scaling_level: 0.1}
outputs: {dir: ../../results_new/s2_steepener_2s10s}
