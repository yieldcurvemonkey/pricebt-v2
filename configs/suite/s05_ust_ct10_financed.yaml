extends: _ust_base_eod.yaml
name: s05_ust_ct10_financed
doc: >
  Long the on-the-run 10Y UST (CT10), 10mm face, financed at GC repo (proxy: the last PUBLISHED SOFR fixing, `extras: {repo: {gc_rate: pricer}}`),
  rolled monthly: every month the position is sold and the then-current CT10 bought (held until the next schedule date). REAL EOD
  clean prices. Economics: P&L dominated by `delta` (10Y yield moves); `carry` = coupon accrual + pull-to-par NET of repo (it is
  negative when SOFR exceeds the 10Y running yield, 2023-2024); the accounting `financing` row (component attribution) isolates the repo leg.
  Bond cost 1/64 point per side. Calendar us_govt_bond (matches the panel's publication days 2018-2026 exactly, bar 2 Good Fridays).
backtest:
  progress: {desc: S5 CT10 FINANCED}
strategy:
  triggers:
    - type: periodic
      frequency: 1m
      calendar: [2023-02-10, 2023-06-15, 2023-08-01, 2023-11-20, 2023-12-04]   # the partial-panel days: roll the next day instead
      actions:
        - type: add_trade
          name: roll_ct10
          priceables: {instrument: ust, name: ct10, terms: {side: buy, security: CT10, notional: 1e7, extras: {repo: {gc_rate: pricer}}}}
          trade_duration: next schedule
          # 1/64 point per side on the face
          transaction_cost: {type: scaled, scaling_type: notional, scaling_level: 1.5625e-4}
outputs: {dir: ../../results_new/s05_ust_ct10_financed, tearsheet: true}
