extends: _ust_base_eod.yaml
name: ctrl_s10b_ust_buy_and_hold
doc: >
  CONTROL. Buy the CT10 of the first date once (10mm face, financed at GC = last published SOFR) and hold it to the end, never rolled:
  the bond ages from 10Y to ~2Y remaining over the window and its coupons (every 15 May / 15 Nov) are swept as cash on the step
  they leave the mark. No signal, one trade, no cost (entry cost 0 so terminal equity is comparable across fill_lag settings).
backtest:
  progress: {desc: S10b CT10 BUY AND HOLD}
strategy:
  triggers:
    - type: date
      dates: [2018-05-01]
      actions:
        - type: add_trade
          name: hold_ct10
          priceables: {instrument: ust, name: ct10, terms: {side: buy, security: CT10, notional: 1e7, extras: {repo: {gc_rate: pricer}}}}
          trade_duration: null
outputs: {dir: ../../results_new/ctrl_s10b_ust_buy_and_hold, tearsheet: true}
