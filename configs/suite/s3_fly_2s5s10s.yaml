extends: _swap_base_eod.yaml
name: s3_fly_2s5s10s
doc: >
  S3. DV01-neutral, belly-weighted 2s5s10s butterfly on REAL EOD SOFR curves, 2022-01-03..2025-12-31: PAY the 5Y belly
  (dv01 +10,000/bp) against RECEIVE 2Y and RECEIVE 10Y wings (dv01 -5,000/bp each, 50/50), re-struck at par monthly.
  P&L ~ +5,000 * d(2*r5 - r2 - r10) in bp: it profits when the belly cheapens against the wings (the fly rises); level- and
  (to first order) slope-neutral. Cost: 0.1 ccy per ccy of dv01 per side.
backtest:
  progress: {desc: S3 FLY 2S5S10S}
strategy:
  triggers:
    - type: periodic
      frequency: 1m
      actions:
        - type: add_scaled_trade
          name: fly_pay5y
          priceables: {instrument: usd_sofr_ois, name: pay5y, terms: {side: pay, maturity: 5Y, notional: 1e7, fixed_rate: par}}
          trade_duration: "next schedule"
          tags: [belly]
          scaling_type: risk_measure
          scaling_risk: dv01
          scaling_level: 10000
          transaction_cost: {type: scaled, scaling_type: "measure:dv01", scaling_level: 0.1}
        - type: add_scaled_trade
          name: fly_recv2y
          priceables: {instrument: usd_sofr_ois, name: recv2y, terms: {side: receive, maturity: 2Y, notional: 1e7, fixed_rate: par}}
          trade_duration: "next schedule"
          tags: [wing]
          scaling_type: risk_measure
          scaling_risk: dv01
          scaling_level: -5000
          transaction_cost: {type: scaled, scaling_type: "measure:dv01", scaling_level: 0.1}
        - type: add_scaled_trade
          name: fly_recv10y
          priceables: {instrument: usd_sofr_ois, name: recv10y, terms: {side: receive, maturity: 10Y, notional: 1e7, fixed_rate: par}}
          trade_duration: "next schedule"
          tags: [wing]
          scaling_type: risk_measure
          scaling_risk: dv01
          scaling_level: -5000
          transaction_cost: {type: scaled, scaling_type: "measure:dv01", scaling_level: 0.1}
outputs: {dir: ../../results_new/s3_fly_2s5s10s}
