extends: _swap_base.yaml
name: s08_swap_intraday_min
doc: >
  S8 (swap, intraday; named s08_* to stay out of the bond suite's s5*-s9* files). Machinery test on REAL 1-minute SOFR curves
  (USD-SOFR-1D-CITIVELOEXCELMIN), the DST week 2026-03-09..13 (Monday 03-09 is the first EDT session after the Sunday change): every day
  a 10Y PAYER (1e7) is opened at 09:30 ET (first session minute if the store has no 09:30 row), stopped out by a strategy_risk trigger when the book
  P&L (as of the PREVIOUS minute's mark) falls below -15,000, else closed at 16:00 ET by a date trigger. Not an alpha claim. Time-of-day instants are
  explicit timestamps on a date trigger (the first market minute of each day).
  Cost: 0.1 ccy per ccy of dv01 per side. See _swap_base.yaml for the instrument spec and the stacks.
backtest:
  session: {open: "09:30", close: "16:00"}
  grid: {from_mdp: primary, start: 2026-03-09, end: 2026-03-13, session_only: true}
  progress: {show: true, desc: S8 SWAP INTRADAY}
  attribution: {cadence: each}
market:
  mdps:
    sofr_min:
      type: "support.curves:CurveStore"
      kwargs: {asset: USD-SOFR-1D-CITIVELOEXCELMIN}
      time: {mode: asof, max_staleness: 2min}
  pricers:
    primary: {mdp: sofr_min, wrap: "pricebt.testing.refstack:wrap"}
strategy:
  triggers:
    # entire_day + fire first: open at 09:30 or, when the store has no 09:30 row (2025-11-03 starts 09:31), at the first minute after it
    - type: date
      dates: [2026-03-09 09:30:00, 2026-03-10 09:30:00, 2026-03-11 09:30:00, 2026-03-12 09:30:00, 2026-03-13 09:30:00]
      entire_day: true
      fire: first
      actions:
        - type: add_trade
          name: open_0930
          priceables: {instrument: usd_sofr_ois, name: pay10y, terms: {side: pay, maturity: 10Y, notional: 1e7, fixed_rate: par}}
          trade_duration: null
          tags: [intraday]
          transaction_cost: {type: scaled, scaling_type: "measure:dv01", scaling_level: 0.1}
    - type: strategy_risk
      risk: pnl
      trigger_level: -15000
      direction: BELOW
      scope: portfolio
      actions:
        - {type: exit_all, name: stop_loss, reason: stop_loss}
    - type: date
      dates: [2026-03-09 16:00:00, 2026-03-10 16:00:00, 2026-03-11 16:00:00, 2026-03-12 16:00:00, 2026-03-13 16:00:00]
      actions:
        - {type: exit_all, name: flat_1600, reason: time_exit_1600}
outputs: {dir: ../../results_new/s08_swap_intraday_min}
