extends: _swap_base_eod.yaml
name: s11_buy_hold_10y
doc: >
  S11 control. Buy-and-hold: receive 10Y SOFR at par on 2022-01-03 and hold it (no roll, no costs) to 2025-12-31 on REAL EOD curves.
  Checks: equity equals an independent raw-library shadow ledger (NPV of the same swap on the store curve + fixed/float cash paid);
  terminal equity is identical under fill_lag 0 and 1.
backtest:
  progress: {desc: S11 BUY AND HOLD 10Y}
strategy:
  triggers:
    - type: date
      dates: [2022-01-03]
      actions:
        - type: add_trade
          name: hold10y
          priceables: {instrument: usd_sofr_ois, name: recv10y, terms: {side: receive, maturity: 10Y, notional: 1e7, fixed_rate: par}}
          trade_duration: null
outputs: {dir: ../../results_new/s11_buy_hold_10y}
