extends: _swap_base_eod.yaml
name: s1m_swap_pay_mirror
doc: >
  S1 mirror. PAY 10Y SOFR swap struck at par, rolled monthly: the exact mirror of S1 on the same REAL curves and dates. Control: S1 + S1m
  gross P&L must sum to zero on every row and every layer must negate (net differs only by the two cost streams).
backtest:
  progress: {desc: S1 PAY MIRROR}
strategy:
  triggers:
    - type: periodic
      frequency: 1m
      actions:
        - type: add_trade
          name: roll10y
          priceables: {instrument: usd_sofr_ois, name: pay10y, terms: {side: pay, maturity: 10Y, notional: 1e7, fixed_rate: par}}
          trade_duration: "next schedule"
          transaction_cost: {type: scaled, scaling_type: "measure:dv01", scaling_level: 0.1}
outputs: {dir: ../../results_new/s1m_swap_pay_mirror}
