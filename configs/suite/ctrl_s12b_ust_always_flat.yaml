extends: _ust_base_eod.yaml
name: ctrl_s12b_ust_always_flat
doc: >
  CONTROL. Always flat on the REAL EOD Treasury market: a level trigger on a constant-0 signal that never fires (barrier 1.0 above) and a
  monthly zero-size scaled add of the financed CT10 (scaling_type size, level 0). The whole trigger -> action -> sizing path runs at every
  point and must book nothing: equity, cash, costs and positions are EXACTLY 0.0 on every row, and there are no trades or orders.
backtest:
  progress: {desc: S12b ALWAYS FLAT}
signals:
  zero: {type: constant, value: 0.0}
strategy:
  triggers:
    - type: mkt
      data_source: zero
      trigger_level: 1.0
      direction: ABOVE
      actions:
        - type: add_trade
          name: never
          priceables: {instrument: ust, name: ct10, terms: {side: buy, security: CT10, notional: 1e7, extras: {repo: {gc_rate: pricer}}}}
          trade_duration: null
    - type: periodic
      frequency: 1m
      calendar: [2023-02-10, 2023-06-15, 2023-08-01, 2023-11-20, 2023-12-04]   # the partial-panel days (as in s05)
      actions:
        - type: add_scaled_trade
          name: zero_size
          priceables: {instrument: ust, name: ct10, terms: {side: buy, security: CT10, notional: 1e7, extras: {repo: {gc_rate: pricer}}}}
          trade_duration: next schedule
          scaling_type: size
          scaling_level: 0
          transaction_cost: {type: scaled, scaling_type: notional, scaling_level: 1.5625e-4}
outputs: {dir: ../../results_new/ctrl_s12b_ust_always_flat, tearsheet: true}
