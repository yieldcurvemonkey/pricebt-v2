extends: _ust_base_eod.yaml
name: s06_ust_2s10s_steepener
doc: >
  DV01-neutral 2s10s STEEPENER in cash UST on REAL EOD prices: long CT2 sized to a DV01 of -10,000 USD/bp (a long bond has
  NEGATIVE dv01), short CT10 sized by a HedgeAction to bring the book's net dv01 to 0. Both legs financed at GC (last published SOFR
  fixing; the long pays repo, the short earns it). P&L ~ +10,000 * d(y10 - y2) in bp: it profits when the curve STEEPENS.
  Rolled monthly (exit everything, re-enter the then-current CT2/CT10). Re-hedged when the net dv01 leaves +/-300 USD/bp, checked every
  5 business days (RiskBandTrigger, check_every 5) with a small CT10 hedge (mode add) that lives until the next roll.
  The monthly CT10 hedge runs in phase ADD (phase: 1) so it is pending when the path-dependent band trigger is evaluated at a roll date
  (otherwise the band trigger would fire first and do the roll hedge itself). Bond cost 1/64 point per side on each leg's face.
backtest:
  progress: {desc: S6 2s10s STEEPENER}
strategy:
  triggers:
    - type: periodic
      frequency: 1m
      calendar: [2023-02-10, 2023-06-15, 2023-08-01, 2023-11-20, 2023-12-04]   # the partial-panel days: roll the next day instead
      actions:
        - {type: exit_all, name: close_book}
        - type: add_scaled_trade
          name: long_2y
          priceables: {instrument: ust, name: ct2, terms: {side: buy, security: CT2, notional: 1e7, extras: {repo: {gc_rate: pricer}}}}
          trade_duration: null
          scaling_type: risk_measure
          scaling_risk: dv01
          scaling_level: -10000
          tags: [leg2y]
          transaction_cost: {type: scaled, scaling_type: notional, scaling_level: 1.5625e-4}
        - type: hedge
          name: short_10y
          risk: dv01
          priceables: {instrument: ust, name: ct10, terms: {side: buy, security: CT10, notional: 1e7, extras: {repo: {gc_rate: pricer}}}}   # hedge quantities come out NEGATIVE: short CT10
          trade_duration: null
          phase: 1
          tags: [leg10y]
          transaction_cost: {type: scaled, scaling_type: notional, scaling_level: 1.5625e-4}
    - type: risk_band
      measure: dv01
      band: 300
      check_every: 5
      actions:
        - type: hedge
          name: rehedge_10y
          risk: dv01
          priceables: {instrument: ust, name: ct10, terms: {side: buy, security: CT10, notional: 1e7, extras: {repo: {gc_rate: pricer}}}}
          trade_duration: null
          tags: [rehedge]
          transaction_cost: {type: scaled, scaling_type: notional, scaling_level: 1.5625e-4}
outputs: {dir: ../../results_new/s06_ust_2s10s_steepener, tearsheet: true}
