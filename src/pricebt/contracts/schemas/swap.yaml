schema_version: 1
asset_class: swap
extends: generic
doc: >-
  A linear interest-rate swap (fixed against a floating overnight rate). Direction sign: +1 is the PAYER of fixed (long the rate); its dv01 is
  positive. The library that implements it owns every convention (schedules, day counts, calendars, fixings, settlement, compounding).
terms:
  side:
    kind: term
    type: enum
    values: [pay, receive]
    aliases: {buy: pay, sell: receive}
    required: true
    doc: "pay = pay fixed (+1, long the rate); receive = receive fixed (-1). `buy`/`sell` are aliases of pay/receive."
  effective:
    kind: term
    type: date_or_tenor
    tokens: [spot]
    default: spot
    doc: "Start of the swap: a date, `spot`, or a tenor forward from spot. Passed through untouched to the factory (the library resolves it)."
  maturity:
    kind: term
    type: date_or_tenor
    required: true
    doc: "End of the swap: a date or a tenor from the effective date, e.g. 10Y. Passed through untouched."
  notional:
    kind: term
    type: number
    required: true
    positive: true
    unit: currency
    doc: "Unsigned notional. Direction is `side`, never the sign of the notional."
  fixed_rate:
    kind: term
    type: number_or_token
    tokens: [par]
    default: par
    unit: percent
    doc: "The fixed rate in PERCENT (4.0 means 4%), or the token `par`. The factory resolves `par` and returns the resolved rate."
  extras:
    kind: term
    type: mapping
    doc: "Per-trade extras for the adapter. Standard key: `par_spread_bp`, a spread in bp over the par rate, used when `fixed_rate` is `par` (gs 'ATMF+25'). Unknown extras are the adapter's error to raise."
direction:
  term: side
  sign: {pay: 1, receive: -1}
methods:
  value:
    kind: method
    required: true
    doc: "Per-unit mark of the swap (holder P&L): see generic."
measures:
  notional:
    kind: measure
    derived: terms.notional
    returns: float
    unit: currency
    sign: unsigned
    doc: "The `notional` term of the trade as built. No binding."
  dv01:
    kind: measure
    required: true
    returns: float
    unit: "currency per +1bp"
    sign: "holder: positive for the payer"
    synonyms: [pv01, dollar_delta, delta, bpv]
    doc: >-
      DOLLAR DELTA: the change in value for a +1bp move of the swap's own market rate, for ONE unit as built with its notional (a 120mm ten-year
      payer is roughly +100,000). Not per unit notional. The engine multiplies by quantity for portfolio risk, triggers and hedge sizing.
  gamma:
    kind: measure
    required: true
    returns: float
    unit: "currency per bp^2"
    sign: holder
    synonyms: [convexity, curvature, second_derivative]
    doc: "Second derivative of the value with respect to the same +1bp move as dv01, per unit as built."
  rate:
    kind: measure
    required: true
    returns: float
    unit: percent
    synonyms: [par_rate, par, market_rate]
    doc: "The market rate of the (remaining) swap: its par rate. Percent."
  delta_ladder:
    kind: measure
    required: true
    args: {tenors: {type: "list[tenor]", required: false, doc: "buckets to report; configured in the binding"}}
    returns: "dict[str, float]"
    unit: "currency per +1bp of the bucket's rate"
    sign: "holder: a payer has positive entries"
    synonyms: [ladder, bucketed_delta, delta_buckets, key_rate_delta]
    doc: >-
      Bucketed dollar delta: keys are tenor strings <int><D|W|M|Y> ("3M", "2Y", "10Y"), values are currency per +1bp move of that bucket's rate.
      The values sum to the parallel dv01 within a declared tolerance. If `tenors` is bound the result has exactly those keys.
layers:
  carry:
    kind: layer
    id: swap.carry
    version: 1
    required: true
    returns: float
    unit: "currency, per unit, over the interval since the previous cadence point"
    needs: [prev_pricer]
    doc: >-
      Value change over the interval if the market were unchanged in date space (forwards are realised), including flows paid in the interval and
      the funding accretion of the mark.
  roll:
    kind: layer
    id: swap.roll
    version: 1
    required: true
    returns: float
    unit: "currency, per unit, over the interval"
    needs: [prev_pricer, fixings]
    doc: >-
      Value change beyond carry if the market were unchanged in TENOR space (the curve rolls down), plus the difference between realised and
      assumed fixings.
  delta:
    kind: layer
    id: swap.delta
    version: 1
    required: true
    returns: float
    unit: "currency, per unit, over the interval"
    needs: [prev_pricer]
    doc: "First-order change from the realised market move: the sum over the curve's risk factors of dV/dx times dx."
  convexity:
    kind: layer
    id: swap.convexity
    version: 1
    required: true
    returns: float
    unit: "currency, per unit, over the interval"
    needs: [prev_pricer]
    doc: "Second-order change from the realised market move: 1/2 dx' Gamma dx over the same risk factors as `delta`."
default_layers: [carry, roll, delta, convexity]
conventions:
  calendar: {type: name, doc: "The NAME of a calendar in the market snapshot, used for schedules, spot and payment dates; the snapshot carries its holidays."}
  spot_lag_days: {type: int, doc: "Business days from the trade date to the spot effective date."}
  day_count: {values: [act360, act365f, actact_icma, actact_isda, thirty360], doc: "Accrual day count of both legs."}
  frequency: {values: [monthly, quarterly, semiannual, annual], doc: "Payment frequency of both legs."}
  business_day_convention: {values: [unadjusted, following, modified_following, preceding, modified_preceding], doc: "How a non-business accrual date is adjusted."}
  payment_lag_days: {type: int, doc: "Business days between the end of an accrual period and its payment."}
  compounding: {values: [daily_compounded, daily_average], doc: "How the floating leg accrues daily rates within a period."}
  stub: {values: [short_front, long_front, short_back, long_back], doc: "Where an irregular period goes."}
  end_of_month: {type: bool, doc: "Whether schedule dates roll to month end."}
  fixing_lag_days: {type: int, doc: "Business days between an observation and its publication for the floating leg."}
  time_accrual: {values: [lump, linear], doc: "How intraday time counts toward carry and roll: `lump` (at the date change) or `linear`."}
pricer_capabilities:
  calendar_advance: {kind: lookup, required: false, args: {date: {type: date}, tenor: {type: tenor}}, returns: date, doc: "The library's own date arithmetic; optional."}
  spot_date: {kind: lookup, required: false, returns: date, doc: "The spot effective date at the snapshot; optional."}
  par_rate: {kind: lookup, required: false, args: {effective: {type: date_or_tenor}, maturity: {type: date_or_tenor}}, returns: float, doc: "Par rate in percent; optional."}
