schema_version: 1
asset_class: generic
doc: >-
  The base every asset class extends: the value contract, the derived measures and the reserved rows the engine itself owns. A schema is DATA: it
  names what pricebt expects (terms, methods, measures, layers) with units and signs, and never says which callable implements a name; a binding
  in config does that.
methods:
  value:
    kind: method
    required: true
    args: {ctx: {type: MarkContext, doc: "the mark context, passed only if the binding references it"}}
    returns: "Valuation | float"
    unit: currency
    sign: "holder: positive is an asset of the holder"
    doc: >-
      One mark of ONE unit of the instrument as built (with its notional). `pv` is the full economic value; `cash` is what was realised in
      [prev_ts, ts) (coupons, swap payments, variation margin); `financing` is the funding accrual over the same interval. Step P&L per unit =
      pv - prev_pv + cash + financing. A bare number means Valuation(pv=number).
measures:
  pv:
    kind: measure
    required: true
    derived: value.pv
    returns: float
    unit: currency
    sign: holder
    doc: "The per-unit mark: the `pv` field of the bound `value`. No separate binding."
  notional:
    kind: measure
    required: false
    returns: float
    unit: currency
    sign: "unsigned"
    synonyms: [face, size, principal]
    doc: >-
      The size of one unit as built, for scaled costs and sizing. Classes that declare a `notional` term derive it from that term and need no
      binding; a class without terms binds it like any other measure.
default_layers: []
reserved_rows:
  total: "step P&L per unit: pv - prev_pv + cash + financing (engine)"
  transactions: "transaction costs (engine)"
  cash_interest: "interest on the cash account (engine)"
  financing: "funding accrual accumulated from `value` (engine accounting row)"
  unexplained: "the engine's remainder: interval P&L minus the sum of requested layers. Only the engine writes this name."
